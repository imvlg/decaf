name: Supabase keepalive

on:
  schedule:
    # Mondays and Thursdays, 06:17 UTC. Free Supabase projects pause after 7 days idle,
    # so twice a week keeps a safe margin even if one run is delayed or skipped.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY in Settings → Secrets and variables → Actions"
            exit 1
          fi
          # A real REST query so Postgres sees activity. RLS may return [] or 401 for the anon role —
          # that still reaches the database, so only network failures and 5xx count as errors.
          status=$(curl -sS -o response.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/de_caf_cafes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          head -c 300 response.txt; echo
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            echo "::error::Supabase did not respond normally"
            exit 1
          fi

      - name: Keep this schedule from being auto-disabled
        # GitHub turns off scheduled workflows after 60 days without repo activity.
        # Re-enabling via the API resets that timer without any commits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
