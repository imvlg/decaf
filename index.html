<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe9de">
  <title>de caf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <style>
    :root {
      --ink: #2b1d16;
      --roast: #5d3d2e;
      --clay: #8a6a55;
      --muted: #8f8378;
      --faint: #ddd2c4;
      --cream: #f4f0e7;
      --paper: #fbf8f2;
      --tint: rgba(93, 61, 46, .06);
      --line: rgba(59, 39, 31, .09);
      --shadow: 0 18px 40px -14px rgba(43, 29, 22, .35), 0 2px 8px rgba(43, 29, 22, .08);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --spring: cubic-bezier(.34, 1.4, .64, 1);
      --gap: 16px;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #ebe5d9; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }

    /* ---------- map ---------- */
    #map { position: fixed; inset: 0; z-index: 0; background: #ebe5d9; }
    .leaflet-container { background: #ebe5d9; font-family: inherit; }
    .leaflet-tile-pane { filter: sepia(.38) saturate(.85) brightness(1.01) contrast(.97); }
    .leaflet-control-attribution {
      margin: 0 8px 6px 0 !important;
      padding: 2px 8px !important;
      border-radius: 8px;
      background: rgba(251, 248, 242, .7) !important;
      color: var(--muted) !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: var(--clay) !important; }

    .glass {
      background: rgba(251, 248, 242, .84);
      border: 1px solid rgba(255, 255, 255, .55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
    }

    .brand {
      position: fixed;
      z-index: 500;
      top: calc(16px + env(safe-area-inset-top));
      left: 16px;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 18px;
    }
    .brand { animation: logo-arrive .55s ease-out both; }
    .brand img { width: 40px; height: 46px; object-fit: contain; }

    .dock {
      position: fixed;
      z-index: 500;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border-radius: 20px;
      animation: drop .6s .08s var(--ease) both;
    }
    .dock-btn {
      position: relative;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: var(--roast);
      background: transparent;
      transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--spring);
    }
    .dock-btn svg { width: 20px; height: 20px; }
    .dock-btn:hover { background: var(--tint); }
    .dock-btn:active { transform: scale(.92); }
    .dock-btn[aria-pressed="true"],
    .dock-btn[aria-expanded="true"] { color: var(--cream); background: var(--roast); }
    .dock-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--clay);
      box-shadow: 0 0 0 2px var(--paper);
      transform: scale(0);
      transition: transform .3s var(--spring);
    }
    .dock-badge.on { transform: scale(1); }

    .search {
      position: relative;
      width: 0;
      overflow: hidden;
      transition: width .4s var(--ease), margin .4s var(--ease);
    }
    .search.open { width: clamp(120px, calc(100vw - 260px), 260px); margin-right: 2px; }
    .search input {
      width: 100%;
      height: 44px;
      padding: 0 34px 0 14px;
      border: 0;
      border-radius: 14px;
      outline: none;
      background: var(--tint);
      font-size: 14px;
    }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-clear {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      opacity: 0;
      transform: translateY(-50%) scale(.6);
      transition: opacity .2s, transform .25s var(--spring);
      pointer-events: none;
    }
    .search-clear svg { width: 14px; height: 14px; }
    .search-clear.on { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }

    .status {
      position: fixed;
      z-index: 500;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 12px);
      transition: opacity .3s var(--ease), transform .4s var(--spring), visibility 0s .4s;
    }
    .status.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
    .status-bean { width: 18px; height: 18px; color: var(--roast); }
    .status.loading .status-bean { animation: spin 1.1s linear infinite; }
    .status-retry {
      width: 30px;
      height: 30px;
      display: none;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--cream);
      background: var(--roast);
    }
    .status-retry svg { width: 15px; height: 15px; }
    .status.error .status-retry { display: grid; }

    .sheet {
      position: fixed;
      z-index: 600;
      top: calc(90px + env(safe-area-inset-top));
      right: 16px;
      width: 380px;
      max-height: calc(100dvh - 106px);
      padding: 22px;
      border-radius: 24px;
      background: rgba(251, 248, 242, .95);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(.97);
      transform-origin: top right;
      transition: opacity .22s var(--ease), transform .3s var(--ease), visibility 0s .3s;
    }
    .sheet.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s var(--ease), transform .5s var(--spring), visibility 0s;
    }
    .sheet-handle { display: none; }

    .sheet-head { display: flex; align-items: flex-start; gap: 8px; }
    .sheet-title { min-width: 0; flex: 1; padding-top: 4px; }
    .sheet-title h1, .sheet-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }
    .sheet-title p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .sheet-title .count { color: var(--muted); font-weight: 500; }

    .icon-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--roast);
      background: var(--tint);
      transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--spring);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:hover { background: rgba(93, 61, 46, .11); }
    .icon-btn:active { transform: scale(.9); }
    .icon-btn[aria-pressed="true"] { color: var(--cream); background: var(--roast); }

    .review-list { display: grid; gap: 10px; margin-top: 10px; }
    .review {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .55);
      animation: rise .45s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 45ms);
    }
    .review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .review-tools { display: flex; align-items: center; gap: 7px; }
    .review-cafe { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .review-date { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .review-delete {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      transition: color .2s var(--ease), background .2s var(--ease);
    }
    .review-delete svg { width: 15px; height: 15px; }
    .review-delete:hover { color: var(--roast); background: var(--tint); }
    .beans { display: flex; gap: 1px; }
    .beans svg { width: 15px; height: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .chips span {
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--clay);
      background: var(--tint);
      font-size: 11px;
      font-weight: 500;
    }
    .review-text { margin: 10px 0 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .review-photo { display: block; width: 100%; max-height: 220px; margin-top: 12px; border-radius: 12px; object-fit: cover; }
    .review-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 0;
      border: 0;
      color: var(--roast);
      background: none;
      font-size: 12px;
      font-weight: 600;
    }
    .review-open svg { width: 14px; height: 14px; transition: transform .25s var(--spring); }
    .review-open:hover svg { transform: translateX(3px); }
    .empty {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      animation: rise .4s var(--ease) both;
    }
    .empty svg { width: 22px; height: 22px; color: var(--faint); transform: rotate(-24deg); }

    .add-review {
      width: 100%;
      height: 44px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 16px;
      color: var(--cream);
      background: var(--roast);
      font-size: 14px;
      font-weight: 600;
      transition: background .25s var(--ease), color .25s var(--ease), transform .2s var(--spring);
    }
    .add-review svg { width: 18px; height: 18px; transition: transform .4s var(--spring); }
    .add-review:active { transform: scale(.98); }
    .add-review[aria-expanded="true"] { color: var(--roast); background: var(--tint); }
    .add-review[aria-expanded="true"] svg { transform: rotate(45deg); }

    .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
    .collapse.open { grid-template-rows: 1fr; }
    .collapse-inner { min-height: 0; overflow: hidden; }
    .collapse-inner > form { opacity: 0; transform: translateY(-6px); transition: opacity .25s var(--ease), transform .35s var(--ease); }
    .collapse.open .collapse-inner > form { opacity: 1; transform: none; transition-delay: .1s; }

    .review-form { display: grid; gap: 11px; padding: 12px 2px 2px; }

    .bean-rating { display: flex; justify-content: center; gap: 4px; }
    .bean-score {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 12px;
      color: var(--faint);
      background: transparent;
      transition: color .15s var(--ease), transform .2s var(--spring);
    }
    .bean-score svg { width: 28px; height: 28px; }
    .bean-score:active { transform: scale(.85); }

    .drink-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .drink {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 7px 4px 6px;
      border: 1.5px solid transparent;
      border-radius: 16px;
      background: var(--tint);
      cursor: pointer;
      transition: border-color .2s var(--ease), background .2s var(--ease), transform .25s var(--spring);
    }
    .drink:hover { transform: translateY(-2px); }
    .drink input { position: absolute; opacity: 0; pointer-events: none; }
    .drink img { width: 52px; height: 46px; object-fit: contain; transition: transform .35s var(--spring); }
    .drink span { color: var(--clay); font-size: 11px; font-weight: 500; }
    .drink:has(input:checked) { border-color: var(--roast); background: rgba(93, 61, 46, .1); }
    .drink:has(input:checked) img { animation: drink-tilt .55s ease-out; }
    .drink:has(input:checked) span { color: var(--ink); }
    .drink:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: 2px; }

    .extras { display: flex; align-items: center; gap: 8px; }
    .toggle-chip {
      height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--clay);
      background: var(--tint);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s var(--ease), color .2s var(--ease);
    }
    .toggle-chip input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-chip:has(input:checked) { color: var(--cream); background: var(--roast); }
    .toggle-chip:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: 2px; }
    .price {
      flex: 1;
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--tint);
      transition: box-shadow .2s var(--ease);
    }
    .price:focus-within { box-shadow: inset 0 0 0 1.5px var(--clay); }
    .price input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; font-weight: 600; }
    .price input::placeholder { color: var(--muted); font-weight: 500; }
    .price span { color: var(--muted); font-size: 13px; }
    .photo-btn {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--roast);
      background: var(--tint) center / cover no-repeat;
      cursor: pointer;
      transition: transform .25s var(--spring), box-shadow .2s;
    }
    .photo-btn:hover { transform: scale(1.06); }
    .photo-btn input { display: none; }
    .photo-btn svg { width: 19px; height: 19px; }
    .photo-btn.has-photo { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--roast); }
    .photo-btn.has-photo svg { opacity: 0; }

    .review-form textarea {
      width: 100%;
      min-height: 78px;
      padding: 10px 12px;
      border: 0;
      border-radius: 16px;
      outline: none;
      background: var(--tint);
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      transition: box-shadow .2s var(--ease);
    }
    .review-form textarea::placeholder { color: var(--muted); }
    .review-form textarea:focus { box-shadow: inset 0 0 0 1.5px var(--clay); }
    .form-status { min-height: 16px; margin: -6px 0 -6px; color: var(--clay); font-size: 12px; text-align: center; }
    .form-status.shake { animation: shake .4s var(--ease); }
    .submit {
      height: 48px;
      border: 0;
      border-radius: 16px;
      color: var(--cream);
      background: var(--ink);
      font-size: 14px;
      font-weight: 600;
      transition: transform .2s var(--spring), opacity .2s;
    }
    .submit:active { transform: scale(.98); }
    .submit:disabled { opacity: .6; cursor: wait; }

    .marker-wrap { border: 0; background: transparent; }
    .pin {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--roast-color, #c98254);
      filter: drop-shadow(0 3px 4px rgba(43, 29, 22, .3));
      transition: transform .3s var(--spring), color .2s;
    }
    .pin svg { width: 26px; height: 26px; transform: rotate(-24deg); }
    .pin svg path:first-child { stroke: rgba(55, 33, 22, .82); stroke-width: .7; paint-order: stroke fill; stroke-linejoin: round; }
    .pin:hover { transform: scale(1.18); }
    .pin.selected { transform: scale(1.4); }
    .cluster {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: transform .3s var(--spring);
    }
    .cluster svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transform: rotate(-24deg); filter: drop-shadow(0 3px 4px rgba(43, 29, 22, .3)); }
    .cluster-fill { fill: var(--roast-color, #452b20); stroke: rgba(251, 248, 242, .8); stroke-width: .55; }
    .cluster-crease { fill: none; stroke: rgba(251, 248, 242, .84); stroke-width: 1.15; stroke-linecap: round; }
    .cluster-number {
      position: relative;
      z-index: 1;
      min-width: 22px;
      height: 19px;
      display: grid;
      place-items: center;
      padding: 0 5px;
      border: 1px solid rgba(93, 61, 46, .22);
      border-radius: 999px;
      color: #4b2e1f;
      background: rgba(251, 248, 242, .94);
      box-shadow: 0 1px 4px rgba(43, 29, 22, .2);
      font: 700 10px/1 "Manrope", system-ui, sans-serif;
    }
    .cluster:hover { transform: scale(1.1); }

    .confirm-dialog {
      width: min(360px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid rgba(93, 61, 46, .16);
      border-radius: 24px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(43, 29, 22, .24);
    }
    .confirm-dialog::backdrop { background: rgba(43, 29, 22, .38); backdrop-filter: blur(3px); }
    .confirm-dialog h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .confirm-dialog p { margin: 8px 0 20px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .confirm-button { min-height: 40px; padding: 0 15px; border: 0; border-radius: 999px; color: var(--roast); background: var(--tint); font: 600 13px "Manrope", system-ui, sans-serif; }
    .confirm-button.destructive { color: var(--cream); background: var(--roast); }
    @keyframes logo-arrive { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drink-tilt {
      0%, 100% { transform: none; }
      38% { transform: rotate(-4deg) scale(1.08); }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 700px) {
      .brand { top: calc(10px + env(safe-area-inset-top)); left: 10px; width: 52px; height: 52px; border-radius: 17px; }
      .brand img { width: 36px; height: 42px; }
      .dock { top: calc(10px + env(safe-area-inset-top)); right: 10px; padding: 4px; border-radius: 18px; }
      .dock-btn { width: 42px; height: 42px; }
      .search.open { width: calc(100vw - 222px); }
      .search input { height: 42px; }

      .sheet {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: auto;
        max-height: 78dvh;
        padding: 26px 18px 20px;
        border-radius: 26px;
        transform: translateY(32px);
        transform-origin: bottom center;
        transition: opacity .22s var(--ease), transform .3s var(--ease), max-height .3s var(--ease), visibility 0s .3s;
      }
      .sheet.open {
        transition: opacity .25s var(--ease), transform .5s var(--spring), max-height .3s var(--ease), visibility 0s;
      }
      .sheet-handle {
        position: sticky;
        top: 0;
        z-index: 5;
        display: block;
        width: 64px;
        height: 24px;
        margin: -26px auto 0;
        border: 0;
        border-radius: 12px;
        background: rgba(251, 248, 242, .95);
        touch-action: none;
        cursor: grab;
      }
      .sheet-handle::before { content: ""; display: block; width: 36px; height: 4px; margin: auto; border-radius: 4px; background: var(--faint); }
      .sheet.compact { max-height: 50dvh; }
      .sheet-title h1, .sheet-title h2 { font-size: 20px; }
      .status { bottom: calc(18px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Мапа кав’ярень Києва"></div>

  <a class="brand glass" href="#" aria-label="de caf"><img src="./de-caf-logo.png" alt="de caf"></a>

  <nav class="dock glass" aria-label="Керування мапою">
    <div class="search" id="searchControl">
      <input id="search" type="search" placeholder="Кав’ярня" autocomplete="off" aria-label="Пошук кав’ярні" tabindex="-1">
      <button class="search-clear" id="clearSearch" type="button" aria-label="Очистити">

  <dialog class="confirm-dialog" id="deleteDialog" aria-labelledby="deleteDialogTitle" aria-describedby="deleteDialogText">

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    (() => {
      const CAFE_CACHE = "decaf-cafes-v6";
      const BOUNDARY_CACHE = "decaf-boundary-v1";
      const VISITED_KEY = "decaf-visited-v1";
      const REVIEWS_KEY = "decaf-reviews-v1";
      const KYIV_AREA = 3600421866;
      const KYIV_RELATION = 421866;
      const KYIV_CENTER = [50.4501, 30.5234];
      const CAFE_TTL = 12 * 60 * 60 * 1000;
      const BOUNDARY_TTL = 30 * 24 * 60 * 60 * 1000;
      const OVERPASS_TIMEOUT = window.innerWidth <= 700 ? 25000 : 45000;
      const OVERPASS_URLS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.private.coffee/api/interpreter",
        "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
      ];
      const DRINKS = [
        ["Фільтр", "./assets/drinks/filter.svg"],
        ["Лате", "./assets/drinks/latte.png"],
        ["Капучино", "./assets/drinks/cappuccino.png"],
        ["Флет вайт", "./assets/drinks/flat-white.png"],
        ["Американо", "./assets/drinks/americano.png"],
        ["Еспресо", "./assets/drinks/espresso.png"]
      ];
      const BEAN_PATH = "M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z";
      const bean = (fill = "currentColor") =>
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + BEAN_PATH + '" fill="' + fill + '"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#fbf8f2" stroke-width="1.3" stroke-linecap="round"/></svg>';
      let beanClipId = 0;
      function ratedBean(rating, index, roasted = "#5d3d2e", unroasted = "#e2cdb0") {
        const fill = Math.max(0, Math.min(1, (Number(rating) || 0) - index));
        if (fill === 0) return bean(unroasted);
        if (fill === 1) return bean(roasted);
        const clipId = "bean-fill-" + (++beanClipId);
        return `<svg viewBox="0 0 24 24" aria-hidden="true">
          <defs><clipPath id="${clipId}"><rect width="${24 * fill}" height="24"/></clipPath></defs>
          <path d="${BEAN_PATH}" fill="${unroasted}"/>
          <path d="${BEAN_PATH}" fill="${roasted}" clip-path="url(#${clipId})"/>
          <path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#fbf8f2" stroke-width="1.3" stroke-linecap="round"/>
        </svg>`;
      }
      const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      const $ = (id) => document.getElementById(id);
      const store = {
        get(key, fallback) {
          try { const value = JSON.parse(localStorage.getItem(key)); return value == null ? fallback : value; }
          catch { return fallback; }
        },
        set(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); return true; }
          catch { return false; }
        }
      };

      const currentCafeCache = store.get(CAFE_CACHE, null);
      const cafeCache = currentCafeCache || store.get("decaf-cafes-v5", {});
      const boundaryCache = store.get(BOUNDARY_CACHE, {});
      let cafes = Array.isArray(cafeCache.places) ? cafeCache.places : [];
      let cafesFetchedAt = currentCafeCache ? Number(cafeCache.fetchedAt) || 0 : 0;
      let cityBoundary = Array.isArray(boundaryCache.rings) ? boundaryCache.rings : [];
      let boundaryFetchedAt = Number(boundaryCache.fetchedAt) || 0;
      let visited = new Set([].concat(store.get(VISITED_KEY, [])));
      let reviews = [].concat(store.get(REVIEWS_KEY, []));
      const cafeRatings = new Map();

      function updateCafeRatings() {
        cafeRatings.clear();
        const totals = new Map();
        reviews.forEach((review) => {
          const score = Number(review.rating);
          if (!review.cafeId || !Number.isFinite(score) || score <= 0) return;
          const value = totals.get(review.cafeId) || { total: 0, count: 0 };
          value.total += score;
          value.count += 1;
          totals.set(review.cafeId, value);
        });
        totals.forEach((value, cafeId) => cafeRatings.set(cafeId, value.total / value.count));
      }
      updateCafeRatings();

      const ROAST_STOPS = [
        { hex: "#c98254", rgb: [201, 130, 84] },
        { hex: "#aa6744", rgb: [170, 103, 68] },
        { hex: "#8d5034", rgb: [141, 80, 52] },
        { hex: "#6c3f2e", rgb: [108, 63, 46] },
        { hex: "#452b20", rgb: [69, 43, 32] }
      ];

      function roastColor(rating) {
        const score = Math.max(0, Math.min(5, Number(rating) || 0));
        const step = Math.max(0, score - 1);
        const lower = Math.floor(step);
        const upper = Math.min(4, lower + 1);
        if (lower === upper || step === lower) return ROAST_STOPS[lower].hex;
        const amount = step - lower;
        const from = ROAST_STOPS[lower].rgb;
        const to = ROAST_STOPS[upper].rgb;
        return "rgb(" + from.map((value, i) => Math.round(value + (to[i] - value) * amount)).join(",") + ")";
      }

      let map, cafePins, maskLayer, boundaryLayer;
      const cafeMarkers = new Map();
      const cafeById = new Map();
      let selectedCafe = null;
      let onlyVisited = false;
      let drawFrame = 0;
      let drawTimer = 0;
      let ratingPreview = null;

      const LIFECYCLE = ["disused", "abandoned", "vacant", "demolished", "removed", "razed", "destroyed", "closed"];
      const NOT_COFFEE_CUISINE = /ice_cream|frozen_yogurt|bubble_tea|\btea\b|hookah|shisha|pizza|burger|sushi|kebab|shawarma|chicken|hot_dog|fast_food|bbq|noodle|ramen|restaurant|bistro|steak_house|seafood/;
      const NOT_COFFEE_NAME = /кальян|hookah|shisha|морозив|ice ?cream|gelato|bubble|шаурм|shawarm|піц|pizz|суші|sushi|бургер|burger|чайхан|tea ?house|їдальн|столова|хінкал|вареничн|пельмен|ресторан|restaurant|бістро|bistro|стейк|steak/i;
      cafes = cafes.filter((cafe) => !NOT_COFFEE_NAME.test(cafe.name || "") && !/закрит|зачинен|не працює|closed/i.test(cafe.name || ""));
      function isOperating(tags) {
        for (const key in tags) {
          if (LIFECYCLE.includes(key.split(":")[0])) return false;
        }
        const closed = [tags.closed, tags.disused, tags.abandoned, tags.vacant, tags.permanently_closed, tags.status, tags["operational_status"]]
          .some((value) => /^(yes|true|1|closed|permanently closed|disused|abandoned|vacant)$/i.test(String(value || "").trim()));
        if (closed) return false;
        if (
          tags.end_date ||
          tags["cafe:state"] === "closed" ||
          tags.lifecycle === "closed" ||
          tags.access === "private" ||
          tags.access === "no"
        ) return false;
        if (/^\s*(closed|off)\s*$/i.test(tags.opening_hours || "")) return false;
        const notes = [tags.name, tags["name:uk"], tags["name:en"], tags.description, tags.note].filter(Boolean).join(" ");
        if (/закрит|зачинен|не працює|closed|permanently closed/i.test(notes)) return false;
        return true;
      }

      function isCoffeePlace(tags, name) {
        if (tags["drink:coffee"] === "no") return false;
        if (tags.shisha === "yes" || tags.hookah === "yes" || tags.cafe === "hookah" || tags.cafe === "shisha") return false;
        const cuisine = (tags.cuisine || "").toLowerCase();
        if (NOT_COFFEE_CUISINE.test(cuisine) || NOT_COFFEE_NAME.test(name)) return false;
        return true;
      }

      function cafeAddress(tags) {
        const street = tags["addr:street"] || tags["addr:place"];
        const number = tags["addr:housenumber"];
        if (street) return street + (number ? ", " + number : "");
        return (tags["addr:full"] || "")
          .replace(/(?:,\s*)?(?:м\.?\s*)?(?:Київ|Kyiv)(?:,\s*Україна)?/gi, "")
          .replace(/^[,\s]+|[,\s]+$/g, "");
      }

      function parseCafes(elements) {
        const unique = new Map();
        elements.forEach((place) => {
          const lat = place.lat != null ? place.lat : place.center && place.center.lat;
          const lon = place.lon != null ? place.lon : place.center && place.center.lon;
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const tags = place.tags || {};
          if (tags.amenity !== "cafe") return;
          const name = (tags.name || tags["name:uk"] || tags.brand || "").trim();
          if (!name || !isOperating(tags) || !isCoffeePlace(tags, name)) return;

          const key = name.toLocaleLowerCase("uk") + "|" + Math.round(lat * 2500) + "|" + Math.round(lon * 1600);
          if (unique.has(key)) return;
          unique.set(key, {
            id: place.type + "/" + place.id,
            name,
            address: cafeAddress(tags),
            lat: +lat.toFixed(6),
            lon: +lon.toFixed(6)
          });
        });
        return Array.from(unique.values()).sort((a, b) => a.name.localeCompare(b.name, "uk"));
      }

      function parseCityBoundary(elements) {
        const relation = elements.find((el) => el.type === "relation" && el.id === KYIV_RELATION);
        if (!relation || !Array.isArray(relation.members)) return [];
        const same = (a, b) => Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
        const rings = [];

        ["outer", "inner"].forEach((role) => {
          const segments = relation.members
            .filter((m) => m.type === "way" && m.role === role && Array.isArray(m.geometry))
            .map((m) => m.geometry.map((p) => [+p.lat.toFixed(5), +p.lon.toFixed(5)]))
            .filter((pts) => pts.length > 1);

          while (segments.length) {
            const ring = segments.shift();
            let joined = true;
            while (!same(ring[0], ring[ring.length - 1]) && joined) {
              joined = false;
              for (let i = 0; i < segments.length; i += 1) {
                const seg = segments[i];
                const first = seg[0];
                const last = seg[seg.length - 1];
                if (same(ring[ring.length - 1], first)) ring.push(...seg.slice(1));
                else if (same(ring[ring.length - 1], last)) ring.push(...seg.slice(0, -1).reverse());
                else if (same(ring[0], last)) ring.unshift(...seg.slice(0, -1));
                else if (same(ring[0], first)) ring.unshift(...seg.slice(1).reverse());
                else continue;
                segments.splice(i, 1);
                joined = true;
                break;
              }
            }
            if (ring.length >= 4 && same(ring[0], ring[ring.length - 1])) rings.push({ role, points: ring });
          }
        });
        return rings;
      }

      async function overpass(query) {
        let lastError = new Error("Overpass unavailable");
        for (const url of OVERPASS_URLS) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), OVERPASS_TIMEOUT);
          try {
            const response = await fetch(url, {
              method: "POST",
              body: new URLSearchParams({ data: query }),
              signal: controller.signal
            });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            if (!Array.isArray(data.elements)) throw new Error("Bad response");
            // Overpass reports timeouts as 200 + remark with partial data — treat as failure
            if (data.remark && /error|timed out|out of memory/i.test(data.remark)) throw new Error(data.remark);
            return data.elements;
          } catch (error) {
            lastError = error;
          } finally {
            clearTimeout(timer);
          }
        }
        throw lastError;
      }

      async function loadCafes(force = false) {
        if (cafes.length) redraw();
        if (!force && cafes.length && Date.now() - cafesFetchedAt < CAFE_TTL) return;
        if (!cafes.length) showStatus("loading");
        try {
          const elements = await overpass(
            "[out:json][timeout:90];area(" + KYIV_AREA + ")->.k;nwr[\"amenity\"=\"cafe\"](area.k);out center;"
          );
          const latest = parseCafes(elements);
          if (!latest.length) throw new Error("Empty");
          cafes = latest;
          cafesFetchedAt = Date.now();
          store.set(CAFE_CACHE, { places: cafes, fetchedAt: cafesFetchedAt });
          hideStatus();
          redraw();
        } catch {
          if (!cafes.length) showStatus("error");
        }
      }

      async function loadBoundary() {
        if (cityBoundary.length) drawBoundary();
        if (cityBoundary.length && Date.now() - boundaryFetchedAt < BOUNDARY_TTL) return;
        try {
          const rings = parseCityBoundary(await overpass("[out:json][timeout:60];relation(" + KYIV_RELATION + ");out geom;"));
          if (!rings.length) return;
          cityBoundary = rings;
          store.set(BOUNDARY_CACHE, { rings, fetchedAt: Date.now() });
          drawBoundary();
        } catch { /* the map works fine without the outline */ }
      }

      function showStatus(kind) {
        const el = $("status");
        el.className = "status glass on " + kind;
        $("statusText").textContent = kind === "loading" ? "Шукаю кав’ярні" : "Не вдалося завантажити";
      }
      function hideStatus() { $("status").classList.remove("on"); }

      function drawBoundary() {
        if (!map || !cityBoundary.length) return;
        maskLayer.clearLayers();
        boundaryLayer.clearLayers();
        const points = cityBoundary.flatMap((ring) => ring.points);
        const outer = L.latLngBounds(points).pad(6);
        const sw = outer.getSouthWest();
        const ne = outer.getNorthEast();
        const frame = [[sw.lat, sw.lng], [ne.lat, sw.lng], [ne.lat, ne.lng], [sw.lat, ne.lng]];
        L.polygon([frame, ...cityBoundary.map((r) => r.points)], {
          pane: "maskPane", stroke: false, fillColor: "#2b1d16", fillOpacity: .22, fillRule: "evenodd", interactive: false
        }).addTo(maskLayer);
        cityBoundary.forEach((ring) => {
          L.polyline(ring.points, { pane: "borderPane", color: "#fbf8f2", weight: 6, opacity: .7, interactive: false }).addTo(boundaryLayer);
          L.polyline(ring.points, { pane: "borderPane", color: "#5d3d2e", weight: 1.6, opacity: .85, interactive: false }).addTo(boundaryLayer);
        });
        map.setMaxBounds(L.latLngBounds(points).pad(.5));
      }

      function visibleCafes() {
        const query = $("search").value.trim().toLocaleLowerCase("uk");
        return cafes.filter((cafe) =>
          (!onlyVisited || visited.has(cafe.id)) &&
          (!query || (cafe.name + " " + cafe.address).toLocaleLowerCase("uk").includes(query))
        );
      }

      function pinIcon(cafe) {
        const classes = ["pin"];
        if (selectedCafe && selectedCafe.id === cafe.id) classes.push("selected");
        const rating = cafeRatings.get(cafe.id) || 0;
        return L.divIcon({
          className: "marker-wrap",
          html: '<span class="' + classes.join(" ") + '" style="--roast-color:' + roastColor(rating) + '">' + bean() + "</span>",
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });
      }

      function clusterIcon(count, rating) {
        const size = count < 10 ? 42 : count < 50 ? 48 : count < 200 ? 54 : 60;
        return L.divIcon({
          className: "marker-wrap",
          html: '<span class="cluster" style="--roast-color:' + roastColor(rating) + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="cluster-fill" d="' + BEAN_PATH + '"/><path class="cluster-crease" d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8"/></svg><span class="cluster-number">' + count + '</span></span>',
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        });
      }

      function clusterRating(cluster) {
        const markers = cluster.getAllChildMarkers();
        let total = 0;
        let rated = 0;
        markers.forEach((marker) => {
          const score = cafeRatings.get(marker.cafeId) || 0;
          if (!score) return;
          total += score;
          rated += 1;
        });
        return rated ? total / rated : 0;
      }

      function drawPins() {
        if (!cafePins) return;
        cafeById.clear();
        cafes.forEach((cafe) => cafeById.set(cafe.id, cafe));
        const query = $("search").value.trim().toLocaleLowerCase("uk");
        const places = cafes.filter((cafe) =>
          (!onlyVisited || visited.has(cafe.id)) &&
          (!query || (cafe.name + " " + cafe.address).toLocaleLowerCase("uk").includes(query))
        );
        const markers = places.map((cafe) => {
          let marker = cafeMarkers.get(cafe.id);
          if (!marker) {
            marker = L.marker([cafe.lat, cafe.lon], {
              icon: pinIcon(cafe),
              title: cafe.name,
              alt: cafe.name
            });
            marker.cafeId = cafe.id;
            marker.on("click", () => {
              const currentCafe = cafeById.get(marker.cafeId);
              if (currentCafe) selectCafe(currentCafe);
            });
            cafeMarkers.set(cafe.id, marker);
          } else {
            marker.setLatLng([cafe.lat, cafe.lon]);
            marker.setIcon(pinIcon(cafe));
          }
          return marker;
        });

        cafePins.clearLayers();
        cafePins.addLayers(markers);
      }

      function redraw() {
        clearTimeout(drawTimer);
        drawTimer = setTimeout(() => {
          drawTimer = 0;
          if (drawFrame) cancelAnimationFrame(drawFrame);
          drawFrame = requestAnimationFrame(() => {
            drawFrame = 0;
            drawPins();
          });
        }, 100);
      }


      const formatDate = (ts) =>
        new Date(Number(ts)).toLocaleDateString("uk-UA", { day: "numeric", month: "short", year: "numeric" });
      const reviewDrinks = (r) => (Array.isArray(r.drinks) ? r.drinks : r.drink ? [r.drink] : []);

      function beansRow(value) {
        const row = document.createElement("div");
        row.className = "beans";
        row.setAttribute("aria-label", ratingLabel(value));
        row.innerHTML = Array.from({ length: 5 }, (_, i) => ratedBean(value, i)).join("");
        return row;
      }

      function ratingLabel(value) {
        const score = Number(value) || 0;
        return score.toLocaleString("uk-UA", { maximumFractionDigits: 1 }) + " з 5";
      }

      function reviewNode(review, index, withCafe) {
        const item = document.createElement("article");
        item.className = "review";
        item.style.setProperty("--i", Math.min(index, 8));

        if (withCafe) {
          const title = document.createElement("h3");
          title.className = "review-cafe";
          title.textContent = review.cafeName || "Кав’ярня";
          item.append(title);
        }

        const head = document.createElement("div");
        head.className = "review-head";
        const date = document.createElement("time");
        date.className = "review-date";
        date.dateTime = new Date(Number(review.createdAt)).toISOString();
        date.textContent = formatDate(review.createdAt);
        const tools = document.createElement("div");
        tools.className = "review-tools";
        const remove = document.createElement("button");
        remove.className = "review-delete";
        remove.type = "button";
        remove.dataset.deleteReview = review.id;
        remove.setAttribute("aria-label", "Видалити відгук");
        remove.title = "Видалити відгук";
        remove.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9 7V4.8h6V7m2.5 0-.8 12H7.3L6.5 7m3.3 3.2v5.6m4.4-5.6v5.6"/></svg>';
        tools.append(date, remove);
        head.append(beansRow(review.rating), tools);
        item.append(head);

        const details = [...reviewDrinks(review), review.decaf ? "декаф" : "", review.price != null ? review.price + " ₴" : ""].filter(Boolean);
        if (details.length) {
          const chips = document.createElement("div");
          chips.className = "chips";
          details.forEach((d) => {
            const chip = document.createElement("span");
            chip.textContent = d;
            chips.append(chip);
          });
          item.append(chips);
        }

        if (review.text) {
          const text = document.createElement("p");
          text.className = "review-text";
          text.textContent = review.text;
          item.append(text);
        }

        if (review.photo) {
          const photo = document.createElement("img");
          photo.className = "review-photo";
          photo.src = review.photo;
          photo.alt = "";
          photo.loading = "lazy";
          item.append(photo);
        }

        if (withCafe && cafes.some((c) => c.id === review.cafeId)) {
          const open = document.createElement("button");
          open.className = "review-open";
          open.type = "button";
          open.dataset.cafeId = review.cafeId;
          open.innerHTML = "На мапі" + ARROW;
          item.append(open);
        }
        return item;
      }

      function emptyNode(text) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = bean();
        empty.append(text);
        return empty;
      }

      const byNewest = (a, b) => Number(b.createdAt) - Number(a.createdAt);

      function renderCafeReviews() {
        const list = $("reviewList");
        const own = reviews.filter((r) => r.cafeId === selectedCafe.id).sort(byNewest);
        list.replaceChildren(...(own.length ? own.map((r, i) => reviewNode(r, i, false)) : [emptyNode("Поки без відгуків")]));
      }

      function renderAllReviews() {
        const list = $("allReviewList");
        const all = [...reviews].sort(byNewest);
        $("reviewsCount").textContent = all.length ? all.length : "";
        list.replaceChildren(...(all.length ? all.map((r, i) => reviewNode(r, i, true)) : [emptyNode("Тут з’являться твої відгуки")]));
      }

      function updateBadge() { $("reviewsBadge").classList.toggle("on", reviews.length > 0); }

      let pendingDeleteId = null;

      function requestReviewDeletion(id) {
        if (!reviews.some((item) => item.id === id)) return;
        pendingDeleteId = id;
        $("deleteDialogText").textContent = "Відгук буде видалено з карти й каталогу.";
        $("deleteDialog").showModal();
      }

      function deleteReview(id) {
        const review = reviews.find((item) => item.id === id);
        if (!review) return false;
        const previous = reviews;
        reviews = reviews.filter((item) => item.id !== id);
        if (!store.set(REVIEWS_KEY, reviews)) {
          reviews = previous;
          return false;
        }
        if (!reviews.some((item) => item.cafeId === review.cafeId)) {
          visited.delete(review.cafeId);
          store.set(VISITED_KEY, Array.from(visited));
        }
        updateCafeRatings();
        redraw();
        if (selectedCafe) renderCafeReviews();
        renderAllReviews();
        updateBadge();
        return true;
      }

      function bump(el) {
        if (reduceMotion || !el.animate) return;
        el.animate([{ transform: "scale(.82)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 380, easing: "cubic-bezier(.34,1.4,.64,1)" });
      }

      function setDrawerOpen(open) {
        $("reviewsDrawer").classList.toggle("open", open);
        $("reviewsToggle").setAttribute("aria-expanded", String(open));
        if (open) {
          $("reviewsDrawer").classList.remove("compact");
          closeCard();
          renderAllReviews();
          $("reviewsDrawer").scrollTop = 0;
        }
      }

      function bindSheetDrag(sheet) {
        const handle = sheet.querySelector(".sheet-handle");
        let startY = null;

        handle.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse") return;
          startY = e.clientY;
          handle.setPointerCapture(e.pointerId);
          e.preventDefault();
          e.stopPropagation();
        });
        handle.addEventListener("pointerup", (e) => {
          if (startY === null) return;
          const distance = e.clientY - startY;
          if (distance > 48) sheet.classList.add("compact");
          if (distance < -48) sheet.classList.remove("compact");
          startY = null;
          e.stopPropagation();
        });
        handle.addEventListener("pointercancel", () => { startY = null; });
      }

      function setFormOpen(open) {
        $("formWrap").classList.toggle("open", open);
        $("addReview").setAttribute("aria-expanded", String(open));
        if (open) {
          $("cafeCard").classList.remove("compact");
          setTimeout(() => $("addReview").scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" }), 180);
        }
      }

      function resetForm() {
        $("reviewForm").reset();
        setRating(0, false);
        $("reviewStatus").textContent = "";
        $("photoBtn").classList.remove("has-photo");
        $("photoBtn").style.backgroundImage = "";
      }

      function selectCafe(cafe, fly = false) {
        setDrawerOpen(false);
        const previousCafe = selectedCafe;
        const changed = !selectedCafe || selectedCafe.id !== cafe.id;
        selectedCafe = cafe;
        if (previousCafe && previousCafe.id !== cafe.id) {
          const previousMarker = cafeMarkers.get(previousCafe.id);
          if (previousMarker) previousMarker.setIcon(pinIcon(previousCafe));
        }
        const selectedMarker = cafeMarkers.get(cafe.id);
        if (selectedMarker) selectedMarker.setIcon(pinIcon(cafe));
        $("cafeName").textContent = cafe.name;
        $("cafeAddress").textContent = cafe.address;
        $("cafeAddress").hidden = !cafe.address;
        if (changed) {
          resetForm();
          setFormOpen(false);
          $("cafeCard").classList.remove("compact");
          $("cafeCard").scrollTop = 0;
        }
        renderCafeReviews();
        $("cafeCard").classList.add("open");
        if (fly) map.flyTo([cafe.lat, cafe.lon], Math.max(map.getZoom(), 17), { duration: .6 });
      }

      function closeCard() {
        if (!selectedCafe) return;
        const cafe = selectedCafe;
        selectedCafe = null;
        const marker = cafeMarkers.get(cafe.id);
        if (marker) marker.setIcon(pinIcon(cafe));
        $("cafeCard").classList.remove("open");
      }

      function setSearchOpen(open) {
        const control = $("searchControl");
        control.classList.toggle("open", open);
        $("searchToggle").setAttribute("aria-expanded", String(open));
        $("search").tabIndex = open ? 0 : -1;
        if (open) {
          setTimeout(() => $("search").focus(), 60);
        } else if ($("search").value) {
          $("search").value = "";
          $("clearSearch").classList.remove("on");
          redraw();
        }
      }

      function buildForm() {
        $("beanRating").innerHTML = Array.from({ length: 5 }, (_, i) =>
          '<button class="bean-score" type="button" data-index="' + i + '" aria-pressed="false" aria-label="' + ratingLabel(i + .5) + ' або ' + ratingLabel(i + 1) + '">' + ratedBean(0, i) + "</button>"
        ).join("");

        DRINKS.forEach(([name, src]) => {
          const label = document.createElement("label");
          label.className = "drink";
          label.innerHTML = '<input type="checkbox" name="drink"><img alt="" draggable="false"><span></span>';
          label.querySelector("input").value = name;
          label.querySelector("img").src = src;
          label.querySelector("span").textContent = name;
          $("drinkPicker").append(label);
        });
      }

      function setRating(value, animate = true) {
        const rating = Math.max(0, Math.min(5, Math.round((Number(value) || 0) * 2) / 2));
        $("beanRating").dataset.value = rating || "";
        ratingPreview = null;
        document.querySelectorAll(".bean-score").forEach((btn, i) => {
          const selected = rating > i && rating <= i + 1;
          btn.setAttribute("aria-pressed", String(selected));
          btn.innerHTML = ratedBean(rating, i);
          if (animate && rating > i && !reduceMotion && btn.animate) {
            btn.animate([{ transform: "scale(.6) rotate(-20deg)" }, { transform: "scale(1)" }], { duration: 360, delay: i * 40, easing: "cubic-bezier(.34,1.4,.64,1)", fill: "backwards" });
          }
        });
      }

      function previewRating(value) {
        const rating = Number(value) || 0;
        if (ratingPreview === rating) return;
        ratingPreview = rating;
        document.querySelectorAll(".bean-score").forEach((btn, i) => {
          btn.innerHTML = ratedBean(rating, i, "#815e48");
        });
      }

      function clearRatingPreview() {
        ratingPreview = null;
        const selected = Number($("beanRating").dataset.value) || 0;
        document.querySelectorAll(".bean-score").forEach((btn, i) => {
          btn.innerHTML = ratedBean(selected, i);
        });
      }

      function formError(text) {
        const status = $("reviewStatus");
        status.textContent = text;
        status.classList.remove("shake");
        void status.offsetWidth;
        status.classList.add("shake");
      }

      async function compressPhoto(file) {
        if (!file) return "";
        if (!file.type.startsWith("image/")) throw new Error("Потрібне зображення");
        if (file.size > 12 * 1024 * 1024) throw new Error("Фото до 12 МБ");
        const url = URL.createObjectURL(file);
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error("Не вдалося відкрити фото"));
            image.src = url;
          });
          const scale = Math.min(1, 1000 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.naturalWidth * scale);
          canvas.height = Math.round(image.naturalHeight * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL("image/jpeg", .78);
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      buildForm();
      bindSheetDrag($("cafeCard"));
      bindSheetDrag($("reviewsDrawer"));
      updateBadge();

      $("beanRating").addEventListener("click", (e) => {
        const btn = e.target.closest(".bean-score");
        if (!btn) return;
        const rect = btn.querySelector("svg").getBoundingClientRect();
        const half = e.detail === 0 || e.clientX >= rect.left + rect.width / 2 ? 1 : .5;
        setRating(Number(btn.dataset.index) + half);
      });

      $("beanRating").addEventListener("keydown", (e) => {
        const btn = e.target.closest(".bean-score");
        if (!btn || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
        const half = e.key === "ArrowLeft" ? .5 : 1;
        setRating(Number(btn.dataset.index) + half);
        e.preventDefault();
      });

      $("beanRating").addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        const grain = e.target.closest(".bean-score svg path");
        const btn = grain && grain.closest(".bean-score");
        if (!btn) return previewRating(0);
        const rect = btn.querySelector("svg").getBoundingClientRect();
        const half = e.clientX < rect.left + rect.width / 2 ? .5 : 1;
        previewRating(Number(btn.dataset.index) + half);
      });
      $("beanRating").addEventListener("pointerleave", clearRatingPreview);

      $("reviewPrice").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
      });

      $("reviewPhoto").addEventListener("change", () => {
        const file = $("reviewPhoto").files[0];
        const btn = $("photoBtn");
        if (btn.dataset.url) URL.revokeObjectURL(btn.dataset.url);
        if (file && file.type.startsWith("image/")) {
          btn.dataset.url = URL.createObjectURL(file);
          btn.style.backgroundImage = "url('" + btn.dataset.url + "')";
          btn.classList.add("has-photo");
          bump(btn);
        } else {
          btn.style.backgroundImage = "";
          btn.classList.remove("has-photo");
        }
      });

      $("reviewForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!selectedCafe) return;
        const rating = Number($("beanRating").dataset.value);
        const drinks = Array.from(document.querySelectorAll('input[name="drink"]:checked'), (i) => i.value);
        const text = $("reviewText").value.trim();
        if (!rating) return formError("Оціни зернятками");
        if (!drinks.length) return formError("Обери напій");

        const submit = $("submitReview");
        submit.disabled = true;
        $("reviewStatus").textContent = "";
        try {
          const review = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
            cafeId: selectedCafe.id,
            cafeName: selectedCafe.name,
            rating,
            drinks,
            decaf: $("reviewDecaf").checked,
            price: $("reviewPrice").value === "" ? null : Number($("reviewPrice").value),
            text,
            photo: await compressPhoto($("reviewPhoto").files[0]),
            createdAt: Date.now()
          };
          reviews.unshift(review);
          if (!store.set(REVIEWS_KEY, reviews)) {
            reviews.shift();
            return formError("Забагато місця — спробуй інше фото");
          }
          if (!visited.has(selectedCafe.id)) {
            visited.add(selectedCafe.id);
            store.set(VISITED_KEY, Array.from(visited));
          }
          updateCafeRatings();
          redraw();
          resetForm();
          setFormOpen(false);
          renderCafeReviews();
          updateBadge();
          $("cafeCard").scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
        } catch (error) {
          formError(error.message || "Не вдалося зберегти");
        } finally {
          submit.disabled = false;
        }
      });

      $("addReview").addEventListener("click", () => setFormOpen(!$("formWrap").classList.contains("open")));
      $("closeCard").addEventListener("click", closeCard);

      $("visitedFilter").addEventListener("click", () => {
        onlyVisited = !onlyVisited;
        $("visitedFilter").setAttribute("aria-pressed", String(onlyVisited));
        redraw();
      });

      $("reviewsToggle").addEventListener("click", () => setDrawerOpen(!$("reviewsDrawer").classList.contains("open")));
      $("closeReviews").addEventListener("click", () => setDrawerOpen(false));
      function handleReviewListClick(e) {
        const remove = e.target.closest("[data-delete-review]");
        if (remove) {
          requestReviewDeletion(remove.dataset.deleteReview);
          return;
        }
        const btn = e.target.closest("[data-cafe-id]");
        const cafe = btn && cafes.find((c) => c.id === btn.dataset.cafeId);
        if (cafe) selectCafe(cafe, true);
      }
      $("reviewList").addEventListener("click", handleReviewListClick);
      $("allReviewList").addEventListener("click", handleReviewListClick);

      $("cancelDelete").addEventListener("click", () => {
        pendingDeleteId = null;
        $("deleteDialog").close();
      });
      $("confirmDelete").addEventListener("click", () => {
        if (pendingDeleteId === null) return;
        if (!deleteReview(pendingDeleteId)) {
          $("deleteDialogText").textContent = "Не вдалося видалити відгук. Перевір вільне місце в браузері.";
          return;
        }
        pendingDeleteId = null;
        $("deleteDialog").close();
      });
      $("deleteDialog").addEventListener("cancel", () => { pendingDeleteId = null; });
      $("deleteDialog").addEventListener("click", (e) => {
        if (e.target === $("deleteDialog")) {
          pendingDeleteId = null;
          $("deleteDialog").close();
        }
      });

      $("searchToggle").addEventListener("click", () => setSearchOpen(!$("searchControl").classList.contains("open")));
      $("search").addEventListener("input", () => {
        $("clearSearch").classList.toggle("on", Boolean($("search").value.trim()));
        redraw();
      });
      $("search").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const matches = visibleCafes();
        if (matches.length === 1) {
          selectCafe(matches[0], true);
        } else if (matches.length > 1 && matches.length < 400) {
          map.flyToBounds(L.latLngBounds(matches.map((c) => [c.lat, c.lon])), { padding: [80, 80], maxZoom: 17, duration: .6 });
        }
        $("search").blur();
      });
      $("clearSearch").addEventListener("click", () => {
        $("search").value = "";
        $("clearSearch").classList.remove("on");
        $("search").focus();
        redraw();
      });

      $("retry").addEventListener("click", () => loadCafes(true));

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (document.activeElement === $("search")) setSearchOpen(false);
        else if ($("reviewsDrawer").classList.contains("open")) setDrawerOpen(false);
        else closeCard();
      });

      if (!window.L || typeof L.markerClusterGroup !== "function") {
        showStatus("error");
        return;
      }

      map = L.map("map", {
        preferCanvas: true,
        zoomControl: false,
        minZoom: 9.5,
        maxZoom: 19,
        zoomSnap: .25,
        zoomDelta: .5,
        zoomAnimation: true,
        markerZoomAnimation: true,
        fadeAnimation: true,
        wheelPxPerZoomLevel: 180,
        maxBounds: L.latLngBounds([[50.05, 29.9], [50.85, 31.05]]),
        maxBoundsViscosity: .9
      }).setView(KYIV_CENTER, window.innerWidth <= 700 ? 10.5 : 11.5);

      map.createPane("maskPane").style.zIndex = 350;
      map.createPane("borderPane").style.zIndex = 370;

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        updateWhenZooming: false,
        keepBuffer: 2,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
      }).addTo(map);

      maskLayer = L.layerGroup().addTo(map);
      boundaryLayer = L.layerGroup().addTo(map);
      cafePins = L.markerClusterGroup({
        maxClusterRadius: (zoom) => zoom < 15 ? 84 : zoom < 18 ? 64 : 44,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        removeOutsideVisibleBounds: true,
        animate: false,
        animateAddingMarkers: false,
        iconCreateFunction: (cluster) => clusterIcon(cluster.getChildCount(), clusterRating(cluster))
      }).addTo(map);

      map.on("click", () => {
        setDrawerOpen(false);
        if (!$("search").value) setSearchOpen(false);
      });

      loadCafes().finally(loadBoundary);
    })();
  </script>
</body>
</html>
