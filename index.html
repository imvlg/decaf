<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <title>de caf</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --espresso: #3b271f;
      --roast: #5d3d2e;
      --clay: #815e48;
      --cream: #f4f0e7;
      --paper: #fffdf8;
      --muted: #82766c;
      --line: rgba(84, 61, 45, .15);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--espresso);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--cream); }
    button, input { font: inherit; }
    button { cursor: pointer; }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #bdbaa9;
    }

    .leaflet-container { background: #bdbaa9; }
    .leaflet-tile-pane { filter: sepia(.46) saturate(.62) hue-rotate(-5deg) brightness(1.02); }
    .leaflet-control-zoom { display: none; }
    .leaflet-control-attribution {
      padding: 3px 7px !important;
      border-radius: 7px 0 0;
      background: rgba(255, 253, 248, .82) !important;
      color: #776c60 !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: var(--roast) !important; }

    .topbar {
      position: fixed;
      z-index: 500;
      top: 14px;
      left: 18px;
      right: 18px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0;
      pointer-events: none;
    }

    .brand {
      flex: 0 0 54px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      pointer-events: auto;
    }
    .brand-logo {
      display: block;
      width: 42px;
      height: 48px;
      object-fit: contain;
    }

    .search-control {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      margin-left: auto;
      pointer-events: auto;
      transition: width .24s ease, flex-basis .24s ease;
    }
    .search-control.open { flex-basis: min(360px, 70vw); width: min(360px, 70vw); }
    .search-icon {
      width: 18px;
      height: 18px;
      color: #8a7c70;
      pointer-events: none;
    }
    .search-toggle {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 0;
      width: 42px;
      height: 42px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: var(--roast);
      background: transparent;
      transition: background .2s ease;
    }
    .search-toggle:hover { background: rgba(248, 245, 238, .45); }
    .search-control.open .search-toggle {
      background: transparent;
    }
    #search {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 42px;
      padding: 0 82px 0 16px;
      border: 1px solid rgba(93, 61, 46, .22);
      border-radius: 999px;
      outline: none;
      color: var(--espresso);
      background: #bdbaa9;
      font-size: 12px;
      box-shadow: 0 4px 14px rgba(58, 39, 28, .12);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scaleX(.08);
      transform-origin: right center;
      transition: opacity .18s ease, transform .24s ease;
    }
    .search-control.open #search { opacity: 1; visibility: visible; pointer-events: auto; transform: scaleX(1); }
    #search::placeholder { color: #9a8e82; }
    #search:focus { border-color: #5d3d2e; box-shadow: 0 4px 14px rgba(58, 39, 28, .16); }
    .clear-search {
      position: absolute;
      z-index: 3;
      top: 8px;
      right: 44px;
      display: none;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      color: var(--clay);
      background: #eee8dd;
    }
    .clear-search.visible { display: block; }

    .map-status {
      position: fixed;
      z-index: 450;
      top: 72px;
      left: 20px;
      padding: 3px 0;
      border: 0;
      border-radius: 0;
      color: var(--muted);
      background: transparent;
      text-shadow: 0 1px 8px rgba(255, 253, 248, .9);
      font-size: 10px;
      pointer-events: none;
    }

    .map-filters {
      position: fixed;
      z-index: 450;
      bottom: 22px;
      left: 22px;
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid rgba(255, 253, 248, .9);
      border-radius: 12px;
      background: rgba(255, 253, 248, .94);
      box-shadow: 0 6px 20px rgba(58, 39, 28, .12);
      backdrop-filter: blur(14px);
    }
    .filter {
      min-height: 34px;
      padding: 0 13px;
      border: 0;
      border-radius: 9px;
      color: #81756a;
      background: transparent;
      font-size: 11px;
    }
    .filter.active { color: #fffaf2; background: var(--roast); }

    .map-buttons {
      position: fixed;
      z-index: 450;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .map-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 253, 248, .9);
      border-radius: 11px;
      color: var(--roast);
      background: rgba(255, 253, 248, .94);
      box-shadow: 0 5px 16px rgba(58, 39, 28, .12);
      backdrop-filter: blur(12px);
    }
    .map-button svg { width: 17px; height: 17px; }

    .cafe-card {
      position: fixed;
      z-index: 460;
      right: 74px;
      bottom: 22px;
      width: 360px;
      max-height: min(78vh, 650px);
      display: none;
      padding: 16px;
      border: 1px solid rgba(255, 253, 248, .9);
      border-radius: 15px;
      background: rgba(255, 253, 248, .96);
      box-shadow: 0 12px 36px rgba(58, 39, 28, .16);
      backdrop-filter: blur(16px);
      overflow-y: auto;
    }
    .cafe-card.open { display: block; }
    .cafe-card-head { display: flex; align-items: flex-start; gap: 12px; }
    .cafe-title {
      min-width: 0;
      flex: 1;
      margin: 0;
      color: var(--espresso);
      font: 20px/1.15 Georgia, "Times New Roman", serif;
    }
    .cafe-address { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .close-card {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      flex: 0 0 26px;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: #f0ebe2;
      font-size: 15px;
    }
    .visit-toggle {
      width: 100%;
      min-height: 39px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #d9cabb;
      border-radius: 10px;
      color: var(--roast);
      background: #f6f1e8;
      font-size: 11px;
      font-weight: 600;
    }
    .visit-toggle.visited { border-color: #746d55; color: #fffaf2; background: #746d55; }
    .visit-toggle svg { width: 14px; height: 14px; }

    .review-section,
    .review-form {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .review-section h2,
    .review-form h2 {
      margin: 0 0 10px;
      color: var(--espresso);
      font: 16px/1.2 Georgia, "Times New Roman", serif;
    }
    .review-list { display: grid; gap: 9px; }
    .review-empty,
    .storage-note {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }
    .review-item {
      padding: 10px;
      border-radius: 10px;
      background: #f4f0e7;
    }
    .review-item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .review-author { color: var(--espresso); font-size: 11px; font-weight: 650; }
    .review-date { color: var(--muted); font-size: 9px; }
    .review-beans { display: inline-flex; gap: 2px; margin-top: 4px; color: #815e48; }
    .review-beans svg { width: 13px; height: 13px; }
    .review-meta { margin: 5px 0 0; color: var(--clay); font-size: 10px; }
    .review-text { margin: 6px 0 0; color: var(--espresso); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .review-photo { display: block; width: 100%; max-height: 190px; margin-top: 8px; border-radius: 8px; object-fit: cover; }
    .review-fields { display: grid; gap: 9px; }
    .review-label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; }
    .review-input,
    .review-select,
    .review-textarea {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid #e2d9cd;
      border-radius: 8px;
      outline: none;
      color: var(--espresso);
      background: #fffdf8;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.35;
    }
    .review-textarea { min-height: 68px; resize: vertical; }
    .review-input:focus,
    .review-select:focus,
    .review-textarea:focus { border-color: #afa089; }
    .rating-field { margin: 0; padding: 0; border: 0; }
    .rating-field legend { margin-bottom: 5px; color: var(--muted); font-size: 10px; }
    .bean-rating { display: flex; gap: 5px; }
    .bean-score {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: #d6cbbc;
      background: transparent;
    }
    .bean-score svg { width: 21px; height: 21px; }
    .bean-score.active,
    .bean-score:hover { color: #5d3d2e; }
    .review-drink-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 9px; }
    .decaf-option { min-height: 36px; display: flex; align-items: center; gap: 6px; color: var(--clay); font-size: 10px; white-space: nowrap; }
    .decaf-option input { accent-color: #5d3d2e; }
    .price-wrap { position: relative; }
    .price-wrap .review-input { padding-right: 35px; }
    .price-currency { position: absolute; top: 11px; right: 10px; color: var(--muted); font-size: 10px; pointer-events: none; }
    .photo-pick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; cursor: pointer; }
    .photo-pick input { display: none; }
    .photo-button { padding: 7px 10px; border: 1px solid #e2d9cd; border-radius: 8px; color: var(--roast); background: #f4f0e7; }
    .review-status { min-height: 14px; margin: 0; color: var(--clay); font-size: 10px; }
    .submit-review {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 9px;
      color: #fffaf2;
      background: #5d3d2e;
      font-size: 11px;
      font-weight: 600;
    }
    .submit-review:disabled { opacity: .65; cursor: wait; }

    .pin {
      width: 28px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1.5px solid #f4f0e7;
      border-radius: 50% 50% 50% 4px;
      color: #fffaf2;
      background: #5d3d2e;
      box-shadow: 0 2px 6px rgba(53, 36, 26, .26);
      transform: rotate(-45deg);
    }
    .pin.visited { color: #3b271f; background: #afa089; }
    .pin svg { width: 16px; height: 16px; transform: rotate(45deg); }
    .cluster {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid #f4f0e7;
      border-radius: 50%;
      color: #fffaf2;
      background: #5d3d2e;
      box-shadow: 0 2px 7px rgba(53, 36, 26, .22);
      font: 600 12px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (max-width: 700px) {
      .topbar {
        top: 10px;
        left: 10px;
        right: 10px;
        height: 42px;
        gap: 10px;
      }
      .brand { height: 42px; flex: 0 0 34px; justify-content: flex-start; }
      .brand-logo { width: 30px; height: 42px; }
      .search-control.open { flex-basis: min(290px, calc(100vw - 86px)); width: min(290px, calc(100vw - 86px)); }
      .map-status { top: 60px; left: 12px; }
      .map-filters {
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .filter { flex: 1; }
      .map-buttons { right: 12px; bottom: 68px; }
      .cafe-card {
        left: 10px;
        right: 10px;
        bottom: calc(68px + env(safe-area-inset-bottom));
        width: auto;
        max-height: calc(100dvh - 150px);
        padding: 14px;
      }
      .leaflet-control-attribution {
        margin-bottom: calc(60px + env(safe-area-inset-bottom)) !important;
        font-size: 8px !important;
      }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Мапа кав’ярень Києва"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="de caf">
      <img class="brand-logo" src="./de-caf-logo.png" alt="de caf">
    </a>

    <div class="search-control" id="searchControl">
      <input id="search" type="search" placeholder="Кав’ярня" autocomplete="off" aria-label="Пошук кав’ярні">
      <button class="clear-search" id="clearSearch" type="button" aria-label="Очистити пошук">×</button>
      <button class="search-toggle" id="searchToggle" type="button" aria-label="Відкрити пошук" aria-expanded="false">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.3 4.3"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="map-status" id="mapStatus">Завантаження…</div>

  <nav class="map-filters" aria-label="Фільтр кав’ярень">
    <button class="filter active" data-filter="all">Усі</button>
    <button class="filter" data-filter="visited">Відвідані</button>
  </nav>

  <div class="map-buttons">
    <button class="map-button" id="zoomIn" aria-label="Збільшити мапу">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.5"/><path d="M10.8 7.5v6.6M7.5 10.8h6.6M16 16l4 4"/></svg>
    </button>
    <button class="map-button" id="showKyiv" aria-label="Показати весь Київ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22"/></svg>
    </button>
  </div>

  <section class="cafe-card" id="cafeCard" aria-live="polite">
    <div class="cafe-card-head">
      <div><h1 class="cafe-title" id="cafeName"></h1><p class="cafe-address" id="cafeAddress"></p></div>
      <button class="close-card" id="closeCard" aria-label="Закрити">×</button>
    </div>
    <button class="visit-toggle" id="visitToggle"></button>
    <section class="review-section" aria-labelledby="reviewListTitle">
      <h2 id="reviewListTitle">Відгуки</h2>
      <div class="review-list" id="reviewList"></div>
    </section>
    <form class="review-form" id="reviewForm">
      <h2>Твій відгук</h2>
      <div class="review-fields">
        <label class="review-label">Ім’я
          <input class="review-input" id="reviewAuthor" name="author" maxlength="32" autocomplete="name" placeholder="Як до тебе звертатись?" required>
        </label>
        <fieldset class="rating-field">
          <legend>Оцінка</legend>
          <div class="bean-rating" id="beanRating" role="group" aria-label="Оцінка від 1 до 5 зерняток">
            <button class="bean-score" type="button" data-rating="1" aria-label="1 з 5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="currentColor"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="bean-score" type="button" data-rating="2" aria-label="2 з 5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="currentColor"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="bean-score" type="button" data-rating="3" aria-label="3 з 5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="currentColor"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="bean-score" type="button" data-rating="4" aria-label="4 з 5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="currentColor"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="bean-score" type="button" data-rating="5" aria-label="5 з 5" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="currentColor"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg></button>
          </div>
          <input id="reviewRating" name="rating" type="hidden">
        </fieldset>
        <div class="review-drink-row">
          <label class="review-label">Напій
            <select class="review-select" id="reviewDrink" name="drink" required>
              <option value="" disabled selected>Обрати напій</option>
              <option>Фільтр</option><option>Лате</option><option>Капучино</option>
              <option>Флет вайт</option><option>Американо</option><option>Еспресо</option><option>Інший</option>
            </select>
          </label>
          <label class="decaf-option"><input id="reviewDecaf" type="checkbox"> Декаф</label>
        </div>
        <label class="review-label">Ціна
          <span class="price-wrap"><input class="review-input" id="reviewPrice" type="number" min="0" max="3000" step="1" inputmode="numeric" placeholder="Не вказувати"><span class="price-currency">грн</span></span>
        </label>
        <label class="review-label">Короткий відгук
          <textarea class="review-textarea" id="reviewText" maxlength="280" placeholder="Що сподобалось у напої?" required></textarea>
        </label>
        <label class="photo-pick"><input id="reviewPhoto" type="file" accept="image/*"><span class="photo-button">Додати фото</span><span id="photoFileName">Фото необов’язкове</span></label>
        <p class="review-status" id="reviewStatus" aria-live="polite"></p>
        <button class="submit-review" id="submitReview" type="submit">Зберегти відгук</button>
      </div>
    </form>
    <p class="storage-note">Зараз відгуки зберігаються лише в цьому браузері.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const CAFE_CACHE = "decaf-osm-cafes-v2";
      const VISITED_KEY = "decaf-visited-v1";
      const REVIEWS_KEY = "decaf-reviews-v1";
      const AUTHOR_KEY = "decaf-review-author-v1";
      const KYIV_AREA = 3600421866;
      const KYIV_RELATION = 421866;
      const KYIV_CENTER = [50.4501, 30.5234];
      const OVERPASS_URLS = [
        "https://overpass-api.de/api/interpreter",
        "https://lz4.overpass-api.de/api/interpreter",
        "https://overpass.private.coffee/api/interpreter"
      ];
      const CACHE_TTL = 12 * 60 * 60 * 1000;

      const byId = (id) => document.getElementById(id);
      let cafes = readCafeCache();
      let cafesCachedAt = readCafeCacheTime();
      let cityBoundary = readCityBoundaryCache();
      let visited = readVisited();
      let reviews = readReviews();
      let map;
      let cafePins;
      let cityMaskLayer;
      let cityBoundaryLayer;
      let mapDrawFrame = 0;
      let selectedCafe = null;
      let activeFilter = "all";

      function readCafeCache() {
        try {
          const stored = JSON.parse(localStorage.getItem(CAFE_CACHE));
          return Array.isArray(stored && stored.places) ? stored.places : [];
        } catch {
          return [];
        }
      }

      function readCafeCacheTime() {
        try {
          const stored = JSON.parse(localStorage.getItem(CAFE_CACHE));
          return Number(stored && stored.fetchedAt) || 0;
        } catch {
          return 0;
        }
      }

      function readCityBoundaryCache() {
        try {
          const stored = JSON.parse(localStorage.getItem(CAFE_CACHE));
          return Array.isArray(stored && stored.cityBoundary) ? stored.cityBoundary : [];
        } catch {
          return [];
        }
      }

      function readVisited() {
        try {
          const stored = JSON.parse(localStorage.getItem(VISITED_KEY));
          return new Set(Array.isArray(stored) ? stored : []);
        } catch {
          return new Set();
        }
      }

      function readReviews() {
        try {
          const stored = JSON.parse(localStorage.getItem(REVIEWS_KEY));
          return Array.isArray(stored) ? stored : [];
        } catch {
          return [];
        }
      }

      function saveReviews() {
        try {
          localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviews));
          return true;
        } catch {
          return false;
        }
      }

      function readReviewAuthor() {
        try {
          return localStorage.getItem(AUTHOR_KEY) || "";
        } catch {
          return "";
        }
      }

      function saveVisited() {
        localStorage.setItem(VISITED_KEY, JSON.stringify(Array.from(visited)));
      }

      function placesToShow() {
        const search = byId("search").value.trim().toLocaleLowerCase("uk");
        return cafes.filter((cafe) => {
          const matchesVisit = activeFilter !== "visited" || visited.has(cafe.id);
          const matchesSearch = !search || (cafe.name + " " + cafe.address).toLocaleLowerCase("uk").includes(search);
          return matchesVisit && matchesSearch;
        });
      }

      function updateCount() {
        const count = placesToShow().length;
        byId("mapStatus").textContent = cafes.length
          ? count.toLocaleString("uk-UA") + " місць"
          : "Завантаження…";
      }

      function cafeAddress(tags) {
        const street = tags["addr:street"] || tags["addr:place"] || tags["addr:suburb"] || tags["addr:district"];
        const number = tags["addr:housenumber"];
        return street ? street + (number ? ", " + number : "") : (tags["addr:full"] || "Київ");
      }

      function parseCafeData(elements) {
        const unique = new Map();
        elements.forEach((place) => {
          const lat = place.lat != null ? place.lat : place.center && place.center.lat;
          const lon = place.lon != null ? place.lon : place.center && place.center.lon;
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

          const tags = place.tags || {};
          if (tags.amenity !== "cafe" && tags.shop !== "coffee") return;
          const name = (tags.name || tags["name:uk"] || tags.brand || "Кав’ярня").trim();
          const key = name.toLocaleLowerCase("uk") + "|" + lat.toFixed(4) + "|" + lon.toFixed(4);
          if (unique.has(key)) return;

          unique.set(key, {
            id: place.type + "/" + place.id,
            type: place.type,
            osmId: place.id,
            name,
            address: cafeAddress(tags),
            lat,
            lon
          });
        });

        return Array.from(unique.values()).sort((a, b) => a.name.localeCompare(b.name, "uk"));
      }

      function parseCityBoundary(elements) {
        const relation = elements.find((element) => element.type === "relation" && element.id === KYIV_RELATION);
        if (!relation || !Array.isArray(relation.members)) return [];

        const samePoint = (a, b) => Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
        const rings = [];

        ["outer", "inner"].forEach((role) => {
          const segments = relation.members
            .filter((member) => member.type === "way" && member.role === role && Array.isArray(member.geometry))
            .map((member) => member.geometry.map((point) => [point.lat, point.lon]))
            .filter((points) => points.length > 1);

          while (segments.length) {
            const ring = segments.shift();
            let joined = true;

            while (!samePoint(ring[0], ring[ring.length - 1]) && joined) {
              joined = false;
              for (let index = 0; index < segments.length; index += 1) {
                const segment = segments[index];
                const first = segment[0];
                const last = segment[segment.length - 1];

                if (samePoint(ring[ring.length - 1], first)) ring.push(...segment.slice(1));
                else if (samePoint(ring[ring.length - 1], last)) ring.push(...segment.slice(0, -1).reverse());
                else if (samePoint(ring[0], last)) ring.unshift(...segment.slice(0, -1));
                else if (samePoint(ring[0], first)) ring.unshift(...segment.slice(1).reverse());
                else continue;

                segments.splice(index, 1);
                joined = true;
                break;
              }
            }

            if (ring.length >= 4 && samePoint(ring[0], ring[ring.length - 1])) rings.push({ role, points: ring });
          }
        });

        return rings;
      }

      function keepMapOnKyiv() {
        if (!map || !cityBoundary.length) return;
        const points = cityBoundary.flatMap((ring) => ring.points);
        const bounds = L.latLngBounds(points).pad(.55);
        map.setMaxBounds(bounds);
      }

      function drawKyivMask() {
        if (!map || !cityMaskLayer || !cityBoundaryLayer || !cityBoundary.length) return;
        cityMaskLayer.clearLayers();

        const points = cityBoundary.flatMap((ring) => ring.points);
        const maskBounds = L.latLngBounds(points).pad(6);
        const southWest = maskBounds.getSouthWest();
        const northEast = maskBounds.getNorthEast();
        const frame = [
          [southWest.lat, southWest.lng],
          [northEast.lat, southWest.lng],
          [northEast.lat, northEast.lng],
          [southWest.lat, northEast.lng],
          [southWest.lat, southWest.lng]
        ];
        const maskRings = [frame, ...cityBoundary.map((ring) => ring.points)];

        L.polygon(maskRings, {
          pane: "cityMaskPane",
          stroke: false,
          fillColor: "#bdbaa9",
          fillOpacity: 1,
          fillRule: "evenodd",
          interactive: false
        }).addTo(cityMaskLayer);
      }

      function drawKyivBoundary() {
        if (!map || !cityBoundaryLayer || !cityBoundary.length) return;
        cityBoundaryLayer.clearLayers();
        cityBoundary.forEach((ring) => {
          L.polyline(ring.points, {
            pane: "cityGlowPane",
            color: "#f4f0e7",
            weight: 8,
            opacity: .92,
            lineCap: "round",
            lineJoin: "round",
            interactive: false
          }).addTo(cityBoundaryLayer);
          L.polyline(ring.points, {
            pane: "cityBorderPane",
            color: "#5d3d2e",
            weight: 2.5,
            opacity: .98,
            lineCap: "round",
            lineJoin: "round",
            interactive: false
          }).addTo(cityBoundaryLayer);
        });
      }

      function drawKyivFocus() {
        drawKyivMask();
        drawKyivBoundary();
      }

      function scheduleMapDraw() {
        if (mapDrawFrame) return;
        mapDrawFrame = requestAnimationFrame(() => {
          mapDrawFrame = 0;
          drawPins();
        });
      }

      function pinIcon(cafe) {
        const state = visited.has(cafe.id) ? "pin visited" : "pin";
        const svg = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8h9.8l-.8 6.1a2 2 0 0 1-2 1.7H7.3a2 2 0 0 1-2-1.7L4.5 8Z"/><path d="M14.2 9h1.2a2 2 0 0 1 0 4h-1.8M7 5.8c0-1 1-1 1-2M11 5.8c0-1 1-1 1-2"/></svg>';
        return L.divIcon({ className: "", html: '<span class="' + state + '">' + svg + "</span>", iconSize: [28, 32], iconAnchor: [14, 16] });
      }

      function clusterIcon(count) {
        return L.divIcon({
          className: "",
          html: '<span class="cluster">' + count + "</span>",
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });
      }

      function drawPins() {
        if (!map || !cafePins) return;
        cafePins.clearLayers();

        const visibleBounds = map.getBounds().pad(.12);
        const places = placesToShow().filter((cafe) => visibleBounds.contains([cafe.lat, cafe.lon]));
        const zoom = map.getZoom();

        if (zoom < 16) {
          const groups = new Map();
          places.forEach((cafe) => {
            const point = map.project([cafe.lat, cafe.lon], zoom);
            const key = Math.floor(point.x / 50) + ":" + Math.floor(point.y / 50);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(cafe);
          });

          groups.forEach((group) => {
            const center = [
              group.reduce((sum, cafe) => sum + cafe.lat, 0) / group.length,
              group.reduce((sum, cafe) => sum + cafe.lon, 0) / group.length
            ];

            if (group.length > 1) {
              const marker = L.marker(center, { icon: clusterIcon(group.length) });
              marker.on("click", () => map.flyTo(center, Math.min(17, zoom + 2), { duration: .4 }));
              marker.addTo(cafePins);
            } else {
              addPin(group[0]);
            }
          });
        } else {
          places.forEach(addPin);
        }

        updateCount();
      }

      function addPin(cafe) {
        const marker = L.marker([cafe.lat, cafe.lon], {
          icon: pinIcon(cafe),
          title: cafe.name,
          alt: cafe.name
        });
        marker.on("click", () => selectCafe(cafe));
        marker.addTo(cafePins);
      }

      function selectCafe(cafe) {
        selectedCafe = cafe;
        byId("cafeName").textContent = cafe.name;
        byId("cafeAddress").textContent = cafe.address;
        byId("reviewForm").reset();
        byId("reviewAuthor").value = readReviewAuthor();
        byId("photoFileName").textContent = "Фото необов’язкове";
        byId("reviewStatus").textContent = "";
        setReviewRating(0);
        renderCafeReviews();
        updateVisitButton();
        byId("cafeCard").classList.add("open");
        drawPins();
      }

      function updateVisitButton() {
        const button = byId("visitToggle");
        const isVisited = selectedCafe && visited.has(selectedCafe.id);
        button.classList.toggle("visited", Boolean(isVisited));
        button.innerHTML = isVisited
          ? '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 10 4 4 8-8"/></svg>Відвідано'
          : "Позначити як відвідану";
      }

      function closeCafeCard() {
        selectedCafe = null;
        byId("cafeCard").classList.remove("open");
        drawPins();
      }

      function setReviewRating(value) {
        const rating = Number(value) || 0;
        byId("reviewRating").value = rating ? String(rating) : "";
        document.querySelectorAll(".bean-score").forEach((button) => {
          const score = Number(button.dataset.rating);
          button.classList.toggle("active", score <= rating);
          button.setAttribute("aria-pressed", String(score === rating));
        });
      }

      function renderCafeReviews() {
        const list = byId("reviewList");
        list.replaceChildren();
        const cafeReviews = reviews
          .filter((review) => review.cafeId === selectedCafe.id)
          .sort((a, b) => Number(b.createdAt) - Number(a.createdAt));

        if (!cafeReviews.length) {
          const empty = document.createElement("p");
          empty.className = "review-empty";
          empty.textContent = "Поки немає відгуків.";
          list.append(empty);
          return;
        }

        cafeReviews.forEach((review) => {
          const item = document.createElement("article");
          item.className = "review-item";

          const head = document.createElement("div");
          head.className = "review-item-head";
          const author = document.createElement("span");
          author.className = "review-author";
          author.textContent = review.author || "Гість";
          const date = document.createElement("time");
          date.className = "review-date";
          date.dateTime = new Date(Number(review.createdAt)).toISOString();
          date.textContent = new Date(Number(review.createdAt)).toLocaleDateString("uk-UA", { day: "numeric", month: "short", year: "numeric" });
          head.append(author, date);

          const rating = document.createElement("div");
          rating.className = "review-beans";
          rating.setAttribute("aria-label", "Оцінка " + review.rating + " з 5");
          rating.innerHTML = Array.from({ length: 5 }, (_, index) => {
            const color = index < Number(review.rating) ? "#815e48" : "#d6cbbc";
            return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z" fill="' + color + '"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#f4f0e7" stroke-width="1.3" stroke-linecap="round"/></svg>';
          }).join("");

          const details = [review.drink, review.decaf ? "декаф" : "", review.price != null ? review.price + " грн" : ""].filter(Boolean);
          const meta = document.createElement("p");
          meta.className = "review-meta";
          meta.textContent = details.join(" · ");
          const text = document.createElement("p");
          text.className = "review-text";
          text.textContent = review.text;

          item.append(head, rating, meta, text);
          if (review.photo) {
            const photo = document.createElement("img");
            photo.className = "review-photo";
            photo.src = review.photo;
            photo.alt = "Фото з відгуку від " + (review.author || "гостя");
            photo.loading = "lazy";
            item.append(photo);
          }
          list.append(item);
        });
      }

      async function compressReviewPhoto(file) {
        if (!file) return "";
        if (!file.type.startsWith("image/")) throw new Error("Обери файл-зображення.");
        if (file.size > 12 * 1024 * 1024) throw new Error("Фото має бути менше 12 МБ.");

        const objectUrl = URL.createObjectURL(file);
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error("Не вдалося відкрити це фото."));
            image.src = objectUrl;
          });
          const scale = Math.min(1, 1000 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.naturalWidth * scale);
          canvas.height = Math.round(image.naturalHeight * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL("image/jpeg", .78);
        } finally {
          URL.revokeObjectURL(objectUrl);
        }
      }

      async function loadCafes() {
        if (cityBoundary.length) {
          keepMapOnKyiv();
          drawKyivFocus();
        }
        if (cafes.length) {
          drawPins();
          if (cityBoundary.length && Date.now() - cafesCachedAt < CACHE_TTL) return;
        }

        const query = '[out:json][timeout:25];area(' + KYIV_AREA + ')->.kyiv;nwr["amenity"="cafe"](area.kyiv)->.cafes;nwr["shop"="coffee"](area.kyiv)->.coffee;relation(' + KYIV_RELATION + ')->.boundary;.cafes out center tags;.coffee out center tags;.boundary out geom;';

        for (const endpoint of OVERPASS_URLS) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000);
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
              body: new URLSearchParams({ data: query }),
              signal: controller.signal
            });
            if (!response.ok) throw new Error("OpenStreetMap " + response.status);

            const data = await response.json();
            if (!Array.isArray(data.elements)) throw new Error("No cafe data");

            const latest = parseCafeData(data.elements);
            if (!latest.length) throw new Error("No places returned");
            cafes = latest;
            const latestBoundary = parseCityBoundary(data.elements);
            if (latestBoundary.length) cityBoundary = latestBoundary;
            cafesCachedAt = Date.now();
            localStorage.setItem(CAFE_CACHE, JSON.stringify({ places: cafes, cityBoundary, fetchedAt: cafesCachedAt }));
            keepMapOnKyiv();
            drawKyivFocus();
            drawPins();
            return;
          } catch {
            continue;
          } finally {
            clearTimeout(timeoutId);
          }
        }

        if (cafes.length) {
          byId("mapStatus").textContent = cafes.length.toLocaleString("uk-UA") + " місць · збережено";
        } else {
          byId("mapStatus").textContent = "Кав’ярні тимчасово недоступні";
        }
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((item) => item.classList.toggle("active", item === button));
          drawPins();
        });
      });

      function setSearchOpen(isOpen) {
        const control = byId("searchControl");
        const toggle = byId("searchToggle");
        control.classList.toggle("open", isOpen);
        toggle.setAttribute("aria-expanded", String(isOpen));
        toggle.setAttribute("aria-label", isOpen ? "Закрити пошук" : "Відкрити пошук");
        if (isOpen) {
          requestAnimationFrame(() => byId("search").focus());
        } else {
          byId("search").value = "";
          byId("clearSearch").classList.remove("visible");
          drawPins();
        }
      }

      byId("searchToggle").addEventListener("click", () => {
        setSearchOpen(!byId("searchControl").classList.contains("open"));
      });
      byId("search").addEventListener("keydown", (event) => {
        if (event.key === "Escape") setSearchOpen(false);
      });

      byId("search").addEventListener("input", () => {
        const hasSearch = Boolean(byId("search").value.trim());
        byId("clearSearch").classList.toggle("visible", hasSearch);
        drawPins();
      });
      byId("search").addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        const matches = placesToShow();
        if (matches.length !== 1) return;
        selectCafe(matches[0]);
        map.flyTo([matches[0].lat, matches[0].lon], 16, { duration: .4 });
      });

      byId("clearSearch").addEventListener("click", () => {
        byId("search").value = "";
        byId("clearSearch").classList.remove("visible");
        drawPins();
        byId("search").focus();
      });

      byId("reviewAuthor").value = readReviewAuthor();
      document.querySelectorAll(".bean-score").forEach((button) => {
        button.addEventListener("click", () => setReviewRating(button.dataset.rating));
      });
      byId("reviewPhoto").addEventListener("change", () => {
        const file = byId("reviewPhoto").files[0];
        byId("photoFileName").textContent = file ? file.name : "Фото необов’язкове";
        byId("reviewStatus").textContent = "";
      });
      byId("reviewForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!selectedCafe) return;
        const rating = Number(byId("reviewRating").value);
        if (!rating) {
          byId("reviewStatus").textContent = "Обери оцінку від 1 до 5 зерняток.";
          return;
        }
        if (!byId("reviewForm").reportValidity()) return;

        const submit = byId("submitReview");
        submit.disabled = true;
        byId("reviewStatus").textContent = "Зберігаю…";
        try {
          const author = byId("reviewAuthor").value.trim();
          const review = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
            cafeId: selectedCafe.id,
            cafeName: selectedCafe.name,
            author,
            rating,
            drink: byId("reviewDrink").value,
            decaf: byId("reviewDecaf").checked,
            price: byId("reviewPrice").value === "" ? null : Number(byId("reviewPrice").value),
            text: byId("reviewText").value.trim(),
            photo: await compressReviewPhoto(byId("reviewPhoto").files[0]),
            createdAt: Date.now()
          };

          reviews.unshift(review);
          if (!saveReviews()) {
            reviews.shift();
            byId("reviewStatus").textContent = "Не вистачає місця для збереження фото. Спробуй інше фото.";
            return;
          }
          try { localStorage.setItem(AUTHOR_KEY, author); } catch { }
          byId("reviewForm").reset();
          byId("reviewAuthor").value = author;
          byId("photoFileName").textContent = "Фото необов’язкове";
          setReviewRating(0);
          renderCafeReviews();
          byId("reviewStatus").textContent = "Збережено на цьому пристрої.";
        } catch (error) {
          byId("reviewStatus").textContent = error.message || "Не вдалося зберегти відгук.";
        } finally {
          submit.disabled = false;
        }
      });
      byId("closeCard").addEventListener("click", closeCafeCard);
      byId("visitToggle").addEventListener("click", () => {
        if (!selectedCafe) return;
        if (visited.has(selectedCafe.id)) visited.delete(selectedCafe.id);
        else visited.add(selectedCafe.id);
        saveVisited();
        updateVisitButton();
        drawPins();
      });

      if (!window.L) {
        byId("mapStatus").textContent = "Мапа недоступна";
        return;
      }

      const INITIAL_ZOOM = window.innerWidth <= 700 ? 10 : 11;
      map = L.map("map", {
        zoomControl: false,
        preferCanvas: true,
        minZoom: 9.5,
        maxZoom: 19,
        zoomSnap: .5,
        maxBounds: L.latLngBounds([[50.05, 29.9], [50.85, 31.05]]),
        maxBoundsViscosity: 1
      }).setView(KYIV_CENTER, INITIAL_ZOOM);

      ["cityMaskPane", "cityGlowPane", "cityBorderPane"].forEach((paneName, index) => {
        map.createPane(paneName);
        map.getPane(paneName).style.zIndex = String(350 + index * 20);
      });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        subdomains: "abc",
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      cityMaskLayer = L.layerGroup().addTo(map);
      cityBoundaryLayer = L.layerGroup().addTo(map);
      cafePins = L.layerGroup().addTo(map);
      map.on("moveend zoomend", scheduleMapDraw);
      byId("zoomIn").addEventListener("click", () => map.zoomIn());
      byId("showKyiv").addEventListener("click", () => map.flyTo(KYIV_CENTER, INITIAL_ZOOM, { duration: .5 }));

      loadCafes();
    })();
  </script>
</body>
</html>
