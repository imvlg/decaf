      });

      $("reviewForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!selectedCafe) return;
        const rating = Number($("beanRating").dataset.value);
        const drinks = Array.from(document.querySelectorAll('input[name="drink"]:checked'), (i) => i.value);
        const text = $("reviewText").value.trim();
        if (!rating) return formError("Оціни зернятками");
        if (!drinks.length) return formError("Обери напій");

        const submit = $("submitReview");
        submit.disabled = true;
        $("reviewStatus").textContent = "";
        const editing = editingReviewId && reviews.find((item) => item.id === editingReviewId);
        try {
          if (sharedRequested && !sharedReady) throw new Error("Спільна мапа ще не підключена");
          if (editing) {
            const fields = {
              rating,
              drinks,
              decaf: $("reviewDecaf").checked,
              price: $("reviewPrice").value === "" ? null : Number($("reviewPrice").value),
              text
            };
            const newPhoto = await compressPhoto($("reviewPhoto").files[0]);
            let updated;
            if (sharedMode) {
              const newPath = newPhoto ? await uploadSharedPhoto(newPhoto, editing.id + "-" + Date.now().toString(36)) : "";
              const { data, error } = await sharedClient.from("de_caf_reviews").update({
                rating: fields.rating,
                drinks: fields.drinks,
                decaf: fields.decaf,
                price: fields.price,
                body: fields.text,
                photo_path: newPath || editing.photo || null
              }).eq("id", editing.id).eq("user_id", sharedUser.id).select("*").single();
              if (error || !data) {
                if (newPath) sharedClient.storage.from(PHOTO_BUCKET).remove([newPath]).catch(() => {});
                throw error || new Error("Update failed");
              }
              if (newPath && editing.photo) {
                sharedClient.storage.from(PHOTO_BUCKET).remove([editing.photo]).catch(() => {});
                photoUrlCache.delete(editing.photo);
              }
              updated = sharedReviewFromRow(data);
            } else {
              updated = { ...editing, ...fields, photo: newPhoto || editing.photo || "", updatedAt: Date.now() };
            }
            const next = reviews.map((item) => item.id === editing.id ? updated : item);
            if (!sharedMode && !store.set(REVIEWS_KEY, next)) return formError("Забагато місця — спробуй інше фото");
            reviews = next;
            updateCafeRatings();
            redraw();
            resetForm();
            setFormOpen(false);
            renderCafeReviews();
            renderAllReviews();
            return;
          }
          let review = {
            id: sharedMode ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
            cafeId: selectedCafe.id,
            cafeName: selectedCafe.name,
            rating,
            drinks,
            decaf: $("reviewDecaf").checked,
            price: $("reviewPrice").value === "" ? null : Number($("reviewPrice").value),
            text,
            photo: await compressPhoto($("reviewPhoto").files[0]),
            createdAt: Date.now(),
            authorName: sharedDisplayName,
            userId: sharedUser && sharedUser.id
          };

          if (sharedMode) {
            const localPhoto = review.photo;
            review.photo = await uploadSharedPhoto(localPhoto, review.id);
            const { data, error } = await sharedClient.from("de_caf_reviews").insert({
              id: review.id,
              cafe_id: review.cafeId,
              cafe_name: review.cafeName,
              user_id: sharedUser.id,
              rating: review.rating,
              drinks: review.drinks,
              decaf: review.decaf,
              price: review.price,
              body: review.text,
              photo_path: review.photo || null
            }).select("*").single();
            if (error) {
              if (review.photo) sharedClient.storage.from(PHOTO_BUCKET).remove([review.photo]);
              throw error;
            }
            review = sharedReviewFromRow(data);
            reviews.unshift(review);
            visited.add(review.cafeId);
          } else {
            reviews.unshift(review);
            if (!store.set(REVIEWS_KEY, reviews)) {
              reviews.shift();
              return formError("Забагато місця — спробуй інше фото");
            }
            visited.add(selectedCafe.id);
            store.set(VISITED_KEY, Array.from(visited));
          }
          updateCafeRatings();
          redraw();
          resetForm();
          setFormOpen(false);
          renderCafeReviews();
          renderAllReviews();
          updateBadge();
          sheetBody("cafeCard").scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
        } catch (error) {
          formError(sharedMode ? "Не вдалося зберегти. Перевір підключення й спробуй ще раз." : error.message || "Не вдалося зберегти");
        } finally {
          submit.disabled = false;
        }
      });

      $("addReview").addEventListener("click", () => {
        const open = $("formWrap").classList.contains("open");
        if (editingReviewId) resetForm();
        setFormOpen(!open);
      });
      $("reviewText").addEventListener("focus", () => {
        if (!mobileQuery.matches) return;
        setTimeout(() => {
          const body = sheetBody("cafeCard");
          const field = $("reviewText");
          const top = field.offsetTop - Math.max(12, (body.clientHeight - field.offsetHeight) / 2);
          body.scrollTo({ top: Math.max(0, top), behavior: reduceMotion ? "auto" : "smooth" });
        }, 320);
      });
      $("closeCard").addEventListener("click", closeCard);

      $("visitedFilter").addEventListener("click", () => {
        onlyVisited = !onlyVisited;
        $("visitedFilter").setAttribute("aria-pressed", String(onlyVisited));
        redraw();
      });

      $("reviewsToggle").addEventListener("click", () => {
        if (sharedRequested && !sharedReady) {
          showStatus("error");
          $("statusText").textContent = "Стрічка поки недоступна — виправ підключення Supabase";
          return;
        }
        setDrawerOpen(!$("reviewsDrawer").classList.contains("open"));
      });
      $("closeReviews").addEventListener("click", () => setDrawerOpen(false));
      function handleReviewListClick(e) {
        const remove = e.target.closest("[data-delete-review]");
        if (remove) {
          requestReviewDeletion(remove.dataset.deleteReview);
          return;
        }
        const edit = e.target.closest("[data-edit-review]");
        if (edit) {
          startEditReview(edit.dataset.editReview);
          return;
        }
        const btn = e.target.closest("[data-cafe-id]");
        const cafe = btn && cafes.find((c) => c.id === btn.dataset.cafeId);
        if (cafe) selectCafe(cafe, true);
      }
      $("reviewList").addEventListener("click", handleReviewListClick);
      $("allReviewList").addEventListener("click", handleReviewListClick);

      $("cancelDelete").addEventListener("click", () => {
        pendingDeleteId = null;
        $("deleteDialog").close();
      });
      $("confirmDelete").addEventListener("click", async () => {
        if (pendingDeleteId === null) return;
        const button = $("confirmDelete");
        button.disabled = true;
        let deleted = false;
        try { deleted = await deleteReview(pendingDeleteId); }
        catch { deleted = false; }
        button.disabled = false;
        if (!deleted) {
          $("deleteDialogText").textContent = "Не вдалося видалити відгук. Спробуй ще раз.";
          $("deleteDialogText").hidden = false;
          return;
        }
        pendingDeleteId = null;
        $("deleteDialog").close();
      });
      $("deleteDialog").addEventListener("close", () => { pendingDeleteId = null; });

      ["deleteDialog", "addCafeDialog", "deleteCafeDialog"].forEach((id) => {
        const dialog = $(id);
        dialog.addEventListener("click", (e) => {
          if (e.target !== dialog) return;
          const rect = dialog.getBoundingClientRect();
          const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
          if (!inside) dialog.close();
        });
      });

      $("searchToggle").addEventListener("click", () => setSearchOpen(!$("searchControl").classList.contains("open")));
      $("search").addEventListener("input", () => {
        $("clearSearch").classList.toggle("on", Boolean($("search").value.trim()));
        redraw();
      });
      $("search").addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const matches = visibleCafes();
        if (matches.length === 1) {
          selectCafe(matches[0], true);
        } else if (matches.length > 1 && matches.length < 400) {
          map.flyToBounds(L.latLngBounds(matches.map((c) => [c.lat, c.lon])), { padding: [80, 80], maxZoom: 17, duration: .6 });
        }
        $("search").blur();
      });
      $("clearSearch").addEventListener("click", () => {
        $("search").value = "";
        $("clearSearch").classList.remove("on");
        $("search").focus();
        redraw();
      });

      $("retry").addEventListener("click", () => loadCafes(true));

      $("addCafeToggle").addEventListener("click", () => {
        if (sharedRequested && !sharedReady) {
          showStatus("error");
          $("statusText").textContent = "Спільна мапа ще не підключена";
          $("retry").hidden = true;
          return;
        }
        setAddingCafe(!addingCafe);
        if (addingCafe) {
          setDrawerOpen(false);
          closeCard();
        }
      });

      $("addCafeForm").addEventListener("submit", saveCafe);
      $("cancelAddCafe").addEventListener("click", () => {
        pendingCafePoint = null;
        $("addCafeDialog").close();
      });
      $("addCafeDialog").addEventListener("close", () => { pendingCafePoint = null; });

      $("cancelDeleteCafe").addEventListener("click", () => {
        pendingCafeRemoval = null;
        $("deleteCafeDialog").close();
      });
      $("deleteCafeDialog").addEventListener("close", () => { pendingCafeRemoval = null; });
      $("confirmDeleteCafe").addEventListener("click", async () => {
        if (!pendingCafeRemoval) return;
        const button = $("confirmDeleteCafe");
        const cafe = pendingCafeRemoval;
        button.disabled = true;
        try {
          await removeCafe(cafe);
          pendingCafeRemoval = null;
          $("deleteCafeDialog").close();
        } catch (error) {
          $("deleteCafeText").textContent = sharedMode
            ? "Не вдалося прибрати кав’ярню зі спільної мапи. Перевір підключення й спробуй ще раз."
            : error.message || "Не вдалося прибрати кав’ярню.";
        } finally {
          button.disabled = false;
        }
      });

      $("shareInvite").addEventListener("click", async () => {
        if (!sharedInviteCode) return;
        const inviteUrl = new URL(location.href);
        inviteUrl.search = "";
        inviteUrl.hash = "";
        inviteUrl.searchParams.set("invite", sharedInviteCode);
        try {
          await navigator.clipboard.writeText(inviteUrl.toString());
        } catch {
          const input = document.createElement("textarea");
          input.value = inviteUrl.toString();
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.append(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        showStatus("success");
        $("statusText").textContent = "Запрошення скопійовано";
        $("retry").hidden = true;
        setTimeout(hideStatus, 1800);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (addingCafe) setAddingCafe(false);
        else if (document.activeElement === $("search")) setSearchOpen(false);
        else if ($("reviewsDrawer").classList.contains("open")) setDrawerOpen(false);
        else closeCard();
      });

      if (!window.L) {
        showStatus("error");
        return;
      }

      map = L.map("map", {
        preferCanvas: true,
        zoomControl: false,
        minZoom: 9.5,
        maxZoom: 19,
        zoomSnap: .5,
        zoomDelta: .5,
        zoomAnimation: true,
        markerZoomAnimation: true,
        fadeAnimation: false,
        wheelPxPerZoomLevel: 60,
        maxBounds: L.latLngBounds([[50.05, 29.9], [50.85, 31.05]]),
        maxBoundsViscosity: .9
      }).setView(KYIV_CENTER, window.innerWidth <= 700 ? 10.5 : 11.5);

      map.createPane("maskPane").style.zIndex = 350;
      map.createPane("borderPane").style.zIndex = 370;

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        updateWhenZooming: false,
        keepBuffer: 1,
        crossOrigin: true,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
      }).addTo(map);

      maskLayer = L.layerGroup().addTo(map);
      boundaryLayer = L.layerGroup().addTo(map);
      createCafeCanvas();
      map.on("zoomanim", animateCafeCanvas);
      map.on("zoom", schedulePinDrawOnPinch);
      map.on("moveend resize", schedulePinDraw);

      const mapElement = map.getContainer();
      mapElement.addEventListener("pointerdown", (event) => {
        if (addingCafe || (event.button !== 0 && event.pointerType !== "touch")) return;
        const rect = mapElement.getBoundingClientRect();
        const cafe = cafeAtPoint({ x: event.clientX - rect.left, y: event.clientY - rect.top });
        if (!cafe) return;
        clearTimeout(longPressTimer);
        longPressStart = {
          pointerId: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          cafe,
          triggered: false
        };
        longPressTimer = setTimeout(() => {
          if (!longPressStart) return;
          longPressStart.triggered = true;
          suppressMapClick = true;
          startCafeShake(cafe);
          setTimeout(() => { suppressMapClick = false; }, 1200);
        }, 650);
      });
      window.addEventListener("pointermove", (event) => {
        if (!longPressStart || event.pointerId !== longPressStart.pointerId) return;
        if (Math.hypot(event.clientX - longPressStart.x, event.clientY - longPressStart.y) > 11) {
          clearTimeout(longPressTimer);
          longPressStart = null;
        }
      }, { passive: true });
      window.addEventListener("pointerup", (event) => {
        if (!longPressStart || event.pointerId !== longPressStart.pointerId) return;
        clearTimeout(longPressTimer);
        longPressStart = null;
      });
      window.addEventListener("pointercancel", () => {
        clearTimeout(longPressTimer);
        longPressStart = null;
      });

      map.on("click", (event) => {
        if (suppressMapClick) {
          suppressMapClick = false;
          return;
        }
        if (addingCafe) {
          openCafeAddDialog(event.latlng);
          return;
        }
        const cafe = cafeAtPoint(event.containerPoint);
        if (cafe) {
          animateCafePinPress(cafe);
          selectCafe(cafe);
          const visibleTop = window.innerHeight * .38;
          if (mobileQuery.matches && event.containerPoint.y > visibleTop) {
            map.panBy([0, event.containerPoint.y - visibleTop * .7], { animate: !reduceMotion, duration: .4 });
          }
        } else if (!$("formWrap").classList.contains("open")) {
          closeCard();
        }
        setDrawerOpen(false);
        if (!$("search").value) setSearchOpen(false);
      });

      loadCafes().finally(loadBoundary);
      if (sharedRequested) initializeSharedWorkspace();

      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => console.warn("Service worker", error));
        });
      }
    })();
  </script>
</body>
</html>
