<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#efe9de">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="de caf">
  <title>de caf</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <style>
    :root {
      --ink: #2b1d16;
      --roast: #5d3d2e;
      --clay: #8a6a55;
      --muted: #8f8378;
      --faint: #ddd2c4;
      --cream: #f4f0e7;
      --paper: #fbf8f2;
      --tint: rgba(93, 61, 46, .06);
      --line: rgba(59, 39, 31, .09);
      --shadow: 0 18px 40px -14px rgba(43, 29, 22, .35), 0 2px 8px rgba(43, 29, 22, .08);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --spring: cubic-bezier(.34, 1.4, .64, 1);
      --gap: 16px;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #ebe5d9; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    svg { display: block; }
    img { -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; }

    /* ---------- map ---------- */
    #map { position: fixed; inset: 0; z-index: 0; background: #ebe5d9; }
    .leaflet-container { background: #ebe5d9; font-family: inherit; }
    .leaflet-tile-pane { filter: sepia(.38) saturate(.85) brightness(1.01) contrast(.97); }
    @media (min-width: 701px) {
      .leaflet-zoom-anim .leaflet-zoom-animated { transition-duration: .16s; }
    }
    .leaflet-control-attribution {
      margin: 0 8px 6px 0 !important;
      padding: 2px 8px !important;
      border-radius: 8px;
      background: rgba(251, 248, 242, .7) !important;
      color: var(--muted) !important;
      font-size: 9px !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: var(--clay) !important; }

    .glass {
      background: rgba(251, 248, 242, .84);
      border: 1px solid rgba(255, 255, 255, .55);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.25);
      -webkit-backdrop-filter: blur(18px) saturate(1.25);
    }

    .brand {
      position: fixed;
      z-index: 500;
      top: calc(16px + env(safe-area-inset-top));
      left: 16px;
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 18px;
    }
    .brand { animation: logo-arrive .55s ease-out both; }
    .brand img { width: 40px; height: 46px; object-fit: contain; }

    .dock {
      position: fixed;
      z-index: 500;
      top: calc(16px + env(safe-area-inset-top));
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border-radius: 20px;
      animation: drop .6s .08s var(--ease) both;
    }
    .dock-btn {
      position: relative;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: var(--roast);
      background: transparent;
      transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--spring);
    }
    .dock-btn svg { width: 20px; height: 20px; }
    .dock-btn:hover { background: var(--tint); }
    .dock-btn:active { transform: scale(.92); }
    .dock-btn[aria-pressed="true"],
    .dock-btn[aria-expanded="true"] { color: var(--cream); background: var(--roast); }
    .dock-btn.dock-feed {
      display: flex;
      width: auto;
      gap: 7px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .dock-feed-label { line-height: 1; }
    .search.open ~ #reviewsToggle { width: 44px; padding: 0; gap: 0; }
    .search.open ~ #reviewsToggle .dock-feed-label { display: none; }
    .dock-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--clay);
      box-shadow: 0 0 0 2px var(--paper);
      transform: scale(0);
      transition: transform .3s var(--spring);
    }
    .dock-badge.on { transform: scale(1); }

    .search {
      position: relative;
      width: 0;
      overflow: hidden;
      transition: width .4s var(--ease), margin .4s var(--ease);
    }
    .search.open { width: clamp(120px, calc(100vw - 260px), 260px); margin-right: 2px; }
    .search input {
      width: 100%;
      height: 44px;
      padding: 0 34px 0 14px;
      border: 0;
      border-radius: 14px;
      outline: none;
      background: var(--tint);
      font-size: 14px;
    }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search-clear {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      opacity: 0;
      transform: translateY(-50%) scale(.6);
      transition: opacity .2s, transform .25s var(--spring);
      pointer-events: none;
    }
    .search-clear svg { width: 14px; height: 14px; }
    .search-clear.on { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }

    .status {
      position: fixed;
      z-index: 500;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 12px);
      transition: opacity .3s var(--ease), transform .4s var(--spring), visibility 0s .4s;
    }
    .status.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
    .status-bean { width: 18px; height: 18px; color: var(--roast); }
    .status.loading .status-bean { animation: spin 1.1s linear infinite; }
    .status-retry {
      width: 30px;
      height: 30px;
      display: none;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--cream);
      background: var(--roast);
    }
    .status-retry svg { width: 15px; height: 15px; }
    .status.error .status-retry { display: grid; }
    .status .status-retry[hidden] { display: none; }

    .sheet {
      position: fixed;
      z-index: 600;
      top: calc(90px + env(safe-area-inset-top));
      right: 16px;
      width: 380px;
      max-height: calc(100dvh - 106px - env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      padding: 0;
      border-radius: 24px;
      background: rgba(251, 248, 242, .95);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(.97);
      transform-origin: top right;
      transition: opacity .22s var(--ease), transform .3s var(--ease), visibility 0s .3s;
    }
    .sheet.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s var(--ease), transform .5s var(--spring), visibility 0s;
    }
    .sheet-top {
      flex: none;
      padding: 20px 20px 10px;
      transition: box-shadow .2s var(--ease);
    }
    .sheet.scrolled .sheet-top { box-shadow: 0 1px 0 var(--line); }
    .sheet-body {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 20px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
    }
    .sheet-body > .review-list:first-child { margin-top: 0; }
    .sheet-handle { display: none; }

    .sheet-head { display: flex; align-items: flex-start; gap: 8px; }
    .sheet-title { min-width: 0; flex: 1; padding-top: 4px; }
    .sheet-title h1, .sheet-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }
    .sheet-title p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .sheet-title .count { color: var(--muted); font-weight: 500; }

    .icon-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--roast);
      background: var(--tint);
      transition: background .2s var(--ease), color .2s var(--ease), transform .2s var(--spring);
    }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn:hover { background: rgba(93, 61, 46, .11); }
    .icon-btn:active { transform: scale(.9); }
    .icon-btn[aria-pressed="true"] { color: var(--cream); background: var(--roast); }

    .review-list { display: grid; gap: 10px; margin-top: 10px; }
    .review {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .55);
      animation: rise .45s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 45ms);
    }
    .review-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .review-tools { display: flex; align-items: center; gap: 2px; }
    .review-cafe { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .review-date { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .review { transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }
    .review.editing { border-color: var(--roast); box-shadow: inset 0 0 0 1px var(--roast); }
    .review-tools .review-date { margin-right: 2px; }
    .review-delete, .review-edit {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--muted);
      background: transparent;
      transition: color .2s var(--ease), background .2s var(--ease);
    }
    .review-delete svg, .review-edit svg { width: 15px; height: 15px; }
    .review-delete:hover, .review-edit:hover, .review-edit[aria-pressed="true"] { color: var(--roast); background: var(--tint); }
    .beans { display: flex; gap: 1px; }
    .beans svg { width: 15px; height: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .chips span {
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--clay);
      background: var(--tint);
      font-size: 11px;
      font-weight: 500;
    }
    .review-text { margin: 10px 0 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .review-photo { display: block; width: 100%; max-height: 220px; margin-top: 12px; border-radius: 12px; object-fit: cover; }
    .review-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 0;
      border: 0;
      color: var(--roast);
      background: none;
      font-size: 12px;
      font-weight: 600;
    }
    .review-open svg { width: 14px; height: 14px; transition: transform .25s var(--spring); }
    .review-open:hover svg { transform: translateX(3px); }
    .empty {
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      animation: rise .4s var(--ease) both;
    }
    .empty svg { width: 22px; height: 22px; color: var(--faint); transform: rotate(-24deg); }

    .add-review {
      width: 100%;
      height: 44px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 16px;
      color: var(--cream);
      background: var(--roast);
      font-size: 14px;
      font-weight: 600;
      transition: background .25s var(--ease), color .25s var(--ease), transform .2s var(--spring);
    }
    .add-review svg { width: 18px; height: 18px; transition: transform .4s var(--spring); }
    .add-review:active { transform: scale(.98); }
    .add-review[aria-expanded="true"] { color: var(--roast); background: var(--tint); }
    .add-review[aria-expanded="true"] svg { transform: rotate(45deg); }

    .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
    .collapse.open { grid-template-rows: 1fr; }
    .collapse-inner { min-height: 0; overflow: hidden; }
    .collapse-inner > form { opacity: 0; transform: translateY(-6px); transition: opacity .25s var(--ease), transform .35s var(--ease); }
    .collapse.open .collapse-inner > form { opacity: 1; transform: none; transition-delay: .1s; }

    .review-form { display: grid; gap: 11px; padding: 12px 2px 2px; }

    .bean-rating { display: flex; justify-content: center; gap: 4px; }
    .bean-score {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 12px;
      color: var(--faint);
      background: transparent;
      transition: color .15s var(--ease), transform .2s var(--spring);
    }
    .bean-score svg { width: 28px; height: 28px; }
    .bean-score:active { transform: scale(.85); }

    .drink-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .drink {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 4px;
      padding: 7px 4px 6px;
      border: 1.5px solid transparent;
      border-radius: 16px;
      background: var(--tint);
      cursor: pointer;
      transition: border-color .2s var(--ease), background .2s var(--ease), transform .25s var(--spring);
    }
    .drink:hover { transform: translateY(-2px); }
    .drink input { position: absolute; opacity: 0; pointer-events: none; }
    .drink img { width: 52px; height: 46px; object-fit: contain; transition: transform .35s var(--spring); }
    .drink span { color: var(--clay); font-size: 11px; font-weight: 500; }
    .drink:has(input:checked) { border-color: var(--roast); background: rgba(93, 61, 46, .1); }
    .drink:has(input:checked) img { animation: drink-tilt .55s ease-out; }
    .drink:has(input:checked) span { color: var(--ink); }
    .drink:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: 2px; }

    .extras { display: flex; align-items: center; gap: 8px; }
    .toggle-chip {
      height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border-radius: 999px;
      color: var(--clay);
      background: var(--tint);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s var(--ease), color .2s var(--ease);
    }
    .toggle-chip input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-chip:has(input:checked) { color: var(--cream); background: var(--roast); }
    .toggle-chip:has(input:focus-visible) { outline: 2px solid var(--clay); outline-offset: 2px; }
    .price {
      flex: 1;
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--tint);
      transition: box-shadow .2s var(--ease);
    }
    .price:focus-within { box-shadow: inset 0 0 0 1.5px var(--clay); }
    .price input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; font-weight: 600; }
    .price input::placeholder { color: var(--muted); font-weight: 500; }
    .price span { color: var(--muted); font-size: 13px; }
    .photo-btn {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--roast);
      background: var(--tint) center / cover no-repeat;
      cursor: pointer;
      transition: transform .25s var(--spring), box-shadow .2s;
    }
    .photo-btn:hover { transform: scale(1.06); }
    .photo-btn input { display: none; }
    .photo-btn svg { width: 19px; height: 19px; }
    .photo-btn.has-photo { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--roast); }
    .photo-btn.has-photo svg { opacity: 0; }

    .review-form textarea {
      width: 100%;
      min-height: 78px;
      padding: 10px 12px;
      border: 0;
      border-radius: 16px;
      outline: none;
      background: var(--tint);
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      transition: box-shadow .2s var(--ease);
    }
    .review-form textarea::placeholder { color: var(--muted); }
    .review-form textarea:focus { box-shadow: inset 0 0 0 1.5px var(--clay); }
    .form-status { min-height: 16px; margin: -6px 0 -6px; color: var(--clay); font-size: 12px; text-align: center; }
    .form-status.shake { animation: shake .4s var(--ease); }
    .submit {
      height: 48px;
      border: 0;
      border-radius: 16px;
      color: var(--cream);
      background: var(--ink);
      font-size: 14px;
      font-weight: 600;
      transition: transform .2s var(--spring), opacity .2s;
    }
    .submit:active { transform: scale(.98); }
    .submit:disabled { opacity: .6; cursor: wait; }

    .cafe-canvas { position: absolute; inset: 0 auto auto 0; pointer-events: none; }
    #map.placing-cafe { cursor: crosshair; }
    #map.placing-cafe .leaflet-interactive { cursor: crosshair; }
    #addCafeToggle[aria-pressed="true"] { color: var(--cream); background: var(--roast); }
    .map-hint { position: fixed; z-index: 510; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); padding: 11px 16px; border-radius: 999px; color: var(--ink); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .2s, transform .2s; }
    .map-hint.on { opacity: 1; transform: translate(-50%, 0); }
    #map.adding-cafe { cursor: crosshair; }
    .review-author { display: block; margin: -4px 0 8px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .dialog-field { width: 100%; height: 46px; margin: 10px 0; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; outline: 0; background: var(--tint); font-size: 14px; }
    .dialog-field:focus { border-color: var(--clay); }
    .confirm-dialog form { margin: 0; }
    .dock-btn[hidden], .icon-btn[hidden] { display: none; }

    .confirm-dialog {
      width: min(360px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid rgba(93, 61, 46, .16);
      border-radius: 24px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(43, 29, 22, .24);
    }
    .confirm-dialog::backdrop { background: rgba(43, 29, 22, .38); backdrop-filter: blur(3px); }
    .confirm-dialog[open] { animation: dialog-in .32s var(--spring) both; }
    .confirm-dialog[open]::backdrop { animation: fade-in .2s var(--ease) both; }
    .confirm-dialog h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .confirm-dialog p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .confirm-dialog p[hidden] { display: none; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .confirm-dialog form .confirm-actions { margin-top: 10px; }
    .confirm-button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 999px; color: var(--roast); background: var(--tint); font: 600 13px "Manrope", system-ui, sans-serif; transition: transform .2s var(--spring), opacity .2s; }
    .confirm-button:active { transform: scale(.96); }
    .confirm-button:disabled { opacity: .6; cursor: wait; }
    .confirm-button.destructive { color: var(--cream); background: var(--roast); }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(10px) scale(.96); } }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes logo-arrive { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drink-tilt {
      0%, 100% { transform: none; }
      38% { transform: rotate(-4deg) scale(1.08); }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 700px) {
      .brand { top: calc(10px + env(safe-area-inset-top)); left: 10px; width: 52px; height: 52px; border-radius: 17px; }
      .brand img { width: 36px; height: 42px; }
      .dock { top: calc(10px + env(safe-area-inset-top)); right: 10px; padding: 4px; border-radius: 18px; }
      .dock-btn { width: 42px; height: 42px; }
      .dock-btn.dock-feed { height: 42px; }
      .search.open ~ #reviewsToggle { width: 42px; height: 42px; }
      .search.open { width: calc(100vw - 266px); }
      .search input { height: 42px; }

      .sheet {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        width: auto;
        max-height: min(80dvh, calc(var(--vvh, 100dvh) - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        border-radius: 26px;
        opacity: 1;
        transform: translateY(calc(100% + 24px));
        transform-origin: bottom center;
        transition: transform .3s var(--ease), max-height .35s var(--ease), visibility 0s .3s;
      }
      .sheet.open {
        transform: translateY(var(--drag, 0px));
        transition: transform .45s var(--spring), max-height .35s var(--ease), visibility 0s;
      }
      .sheet.dragging { transition: none; }
      .sheet.compact { max-height: min(46dvh, calc(var(--vvh, 100dvh) - 80px)); }
      .sheet-top {
        padding: 0 16px 10px;
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      .sheet.dragging .sheet-top { cursor: grabbing; }
      .sheet-handle {
        display: block;
        width: 38px;
        height: 4px;
        margin: 8px auto 8px;
        border-radius: 4px;
        background: var(--faint);
      }
      .sheet-title { padding-top: 6px; }
      .sheet-body { padding: 0 16px calc(16px + env(safe-area-inset-bottom) * .3); }
      .sheet-title h1, .sheet-title h2 { font-size: 20px; }
      .review { padding: 13px; }
      .review-delete, .review-edit { width: 36px; height: 36px; }
      .bean-score { width: 44px; height: 44px; }
      .search input, .price input, .review-form textarea, .dialog-field { font-size: 16px; }
      .confirm-dialog { padding: 22px 20px 20px; border-radius: 26px; }
      .confirm-actions { gap: 8px; }
      .confirm-button { flex: 1; min-height: 46px; font-size: 14px; }
      .status { bottom: calc(18px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); }
      .map-hint { bottom: calc(18px + env(safe-area-inset-bottom)); white-space: nowrap; }
    }
  </style>
</head>
<body>

  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script>
    (() => {
      const isImageElement = (target) => target instanceof Element && target.closest("img");
      document.addEventListener("contextmenu", (event) => {
        if (isImageElement(event.target)) event.preventDefault();
      });
      document.addEventListener("dragstart", (event) => {
        if (isImageElement(event.target)) event.preventDefault();
      });

      const CAFE_CACHE = "decaf-cafes-v6";
      const BOUNDARY_CACHE = "decaf-boundary-v1";
      const VISITED_KEY = "decaf-visited-v1";
      const REVIEWS_KEY = "decaf-reviews-v1";
      const CUSTOM_CAFES_KEY = "decaf-custom-cafes-v1";
      const HIDDEN_CAFES_KEY = "decaf-hidden-cafes-v1";
      const PHOTO_BUCKET = "de-caf-photos";
      const sharedConfig = window.DECAF_SHARED_CONFIG || {};
      const INVITE_KEY = "decaf-invite-v1";
      const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      const inviteFromUrl = (() => {
        const fromUrl = new URLSearchParams(location.search).get("invite");
        try {
          if (fromUrl) localStorage.setItem(INVITE_KEY, fromUrl);
          else if (isStandalone) return localStorage.getItem(INVITE_KEY);
        } catch { /* storage unavailable */ }
        return fromUrl;
      })();
      const KYIV_AREA = 3600421866;
      const KYIV_RELATION = 421866;
      const KYIV_CENTER = [50.4501, 30.5234];
      const MANUAL_CAFES = [
        { id: "manual/slou-hospitalna-2", name: "Slou Coffee", address: "вул. Госпітальна, 2", lat: 50.437855, lon: 30.524426 }
      ];
      const MANUALLY_CLOSED_CAFES = [
        { name: "Aroma Kava", lat: 50.433971, lon: 30.530467, radiusMeters: 70 }
      ];
      const CAFE_TTL = 12 * 60 * 60 * 1000;
      const BOUNDARY_TTL = 30 * 24 * 60 * 60 * 1000;
      const OVERPASS_TIMEOUT = window.innerWidth <= 700 ? 25000 : 45000;
      const OVERPASS_URLS = [
        "https://overpass-api.de/api/interpreter",
        "https://overpass.private.coffee/api/interpreter",
        "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
      ];
      const DRINKS = [
        ["Фільтр", "./assets/drinks/filter.svg"],
        ["Лате", "./assets/drinks/latte.png"],
        ["Капучино", "./assets/drinks/cappuccino.png"],
        ["Флет вайт", "./assets/drinks/flat-white.png"],
        ["Американо", "./assets/drinks/americano.png"],
        ["Еспресо", "./assets/drinks/espresso.png"]
      ];
      const BEAN_PATH = "M17.4 3.1c3.1 2.5 2.8 7.6-.5 12.2s-8.1 7-11.3 4.5-2.9-7.5.5-12.1 8.2-7.1 11.3-4.6Z";
      const BEAN_SHAPE = typeof Path2D === "function" ? new Path2D(BEAN_PATH) : null;
      const bean = (fill = "currentColor") =>
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + BEAN_PATH + '" fill="' + fill + '"/><path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#fbf8f2" stroke-width="1.3" stroke-linecap="round"/></svg>';
      let beanClipId = 0;
      function ratedBean(rating, index, roasted = "#5d3d2e", unroasted = "#e2cdb0") {
        const fill = Math.max(0, Math.min(1, (Number(rating) || 0) - index));
        if (fill === 0) return bean(unroasted);
        if (fill === 1) return bean(roasted);
        const clipId = "bean-fill-" + (++beanClipId);
        return `<svg viewBox="0 0 24 24" aria-hidden="true">
          <defs><clipPath id="${clipId}"><rect width="${24 * fill}" height="24"/></clipPath></defs>
          <path d="${BEAN_PATH}" fill="${unroasted}"/>
          <path d="${BEAN_PATH}" fill="${roasted}" clip-path="url(#${clipId})"/>
          <path d="M6.2 18.7C11.5 15.2 15 9.4 17.1 4.8" fill="none" stroke="#fbf8f2" stroke-width="1.3" stroke-linecap="round"/>
        </svg>`;
      }
      const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      const $ = (id) => document.getElementById(id);
      const store = {
        get(key, fallback) {
          try { const value = JSON.parse(localStorage.getItem(key)); return value == null ? fallback : value; }
          catch { return fallback; }
        },
        set(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); return true; }
          catch { return false; }
        }
      };

      const sharedInviteCode = inviteFromUrl || "";
      const sharedRequested = Boolean(sharedInviteCode);
      let sharedMode = false;
      let sharedReady = false;
      let sharedClient = null;
      let sharedUser = null;
      let sharedDisplayName = "";
      let sharedCafeRows = [];
      let sharedHiddenCafeIds = new Set();
      let sharedRefreshTimer = 0;
      let sharedChannel = null;

      if (sharedRequested) {
        $("reviewsToggle").hidden = false;
        $("reviewsToggle").setAttribute("aria-label", "Стрічка");
        $("reviewsToggle").title = "Стрічка";
      }

      const currentCafeCache = store.get(CAFE_CACHE, null);
      const cafeCache = currentCafeCache || store.get("decaf-cafes-v5", {});
      const boundaryCache = store.get(BOUNDARY_CACHE, {});
      let osmCafes = Array.isArray(cafeCache.places) ? cafeCache.places : [];
      let cafes = osmCafes.slice();
      let localCustomCafes = [].concat(store.get(CUSTOM_CAFES_KEY, []));
      let localHiddenCafeIds = new Set([].concat(store.get(HIDDEN_CAFES_KEY, [])));
      let cafesFetchedAt = currentCafeCache ? Number(cafeCache.fetchedAt) || 0 : 0;
      let cityBoundary = Array.isArray(boundaryCache.rings) ? boundaryCache.rings : [];
      let boundaryFetchedAt = Number(boundaryCache.fetchedAt) || 0;
      let visited = new Set([].concat(store.get(VISITED_KEY, [])));
      const localReviews = [].concat(store.get(REVIEWS_KEY, []));
      let reviews = sharedRequested ? [] : localReviews.slice();
      const cafeRatings = new Map();

      function updateCafeRatings() {
        cafeRatings.clear();
        const totals = new Map();
        reviews.forEach((review) => {
          const score = Number(review.rating);
          if (!review.cafeId || !Number.isFinite(score) || score <= 0) return;
          const value = totals.get(review.cafeId) || { total: 0, count: 0 };
          value.total += score;
          value.count += 1;
          totals.set(review.cafeId, value);
        });
        totals.forEach((value, cafeId) => cafeRatings.set(cafeId, value.total / value.count));
      }
      updateCafeRatings();

      const ROAST_STOPS = [
        { hex: "#eadfce", rgb: [234, 223, 206] },
        { hex: "#cdb99d", rgb: [205, 185, 157] },
        { hex: "#aa8e6f", rgb: [170, 142, 111] },
        { hex: "#806145", rgb: [128, 97, 69] },
        { hex: "#5d3d2e", rgb: [93, 61, 46] },
        { hex: "#321f17", rgb: [50, 31, 23] }
      ];

      function roastColor(rating) {
        const score = Math.max(0, Math.min(5, Number(rating) || 0));
        if (score === 0) return ROAST_STOPS[0].hex;
        const lower = Math.floor(score);
        const upper = Math.min(5, lower + 1);
        if (lower === upper || score === lower) return ROAST_STOPS[lower].hex;
        const amount = score - lower;
        const from = ROAST_STOPS[lower].rgb;
        const to = ROAST_STOPS[upper].rgb;
        return "rgb(" + from.map((value, i) => Math.round(value + (to[i] - value) * amount)).join(",") + ")";
      }

      let map, maskLayer, boundaryLayer, cafeCanvas, cafeCanvasContext;
      let cafeCanvasOriginLatLng = null;
      let cafeCanvasBaseZoom = null;
      let mapCafes = [];
      let visiblePins = [];
      const cafeById = new Map();
      let selectedCafe = null;
      let onlyVisited = false;
      let drawFrame = 0;
      let drawTimer = 0;
      let pinPressAnimation = null;
      const PIN_PRESS_DURATION = 360;
      let ratingPreview = null;
      let addingCafe = false;
      let pendingCafePoint = null;
      let pendingCafeRemoval = null;
      let shakingCafeId = null;
      let longPressTimer = 0;
      let longPressStart = null;
      let suppressMapClick = false;
      const photoUrlCache = new Map();
      let editingReviewId = null;
      const mobileQuery = matchMedia("(max-width: 700px)");

      const LIFECYCLE = ["disused", "abandoned", "vacant", "demolished", "removed", "razed", "destroyed", "closed"];
      const NOT_COFFEE_CUISINE = /ice_cream|frozen_yogurt|bubble_tea|\btea\b|hookah|shisha|pizza|burger|sushi|kebab|shawarma|chicken|hot_dog|fast_food|bbq|noodle|ramen|restaurant|bistro|steak_house|seafood/;
      const NOT_COFFEE_NAME = /кальян|hookah|shisha|морозив|ice ?cream|gelato|bubble|шаурм|shawarm|піц|pizz|суші|sushi|бургер|burger|чайхан|tea ?house|їдальн|столова|хінкал|вареничн|пельмен|ресторан|restaurant|бістро|bistro|стейк|steak/i;
osmCafes = osmCafes
        .filter((cafe) => !NOT_COFFEE_NAME.test(cafe.name || "") && !/закрит|зачинен|не працює|closed/i.test(cafe.name || ""))
        .map((cafe) => ({ ...cafe, source: "osm" }));
      localCustomCafes = localCustomCafes.map((cafe) => ({ ...cafe, source: "local" }));
      function refreshCafeList() {
        const hiddenIds = sharedMode ? sharedHiddenCafeIds : localHiddenCafeIds;
        const customRows = sharedMode ? sharedCafeRows : localCustomCafes;
        const merged = new Map();
        osmCafes.forEach((cafe) => { if (!hiddenIds.has(cafe.id)) merged.set(cafe.id, cafe); });
        customRows.forEach((cafe) => { if (!hiddenIds.has(cafe.id)) merged.set(cafe.id, cafe); });
        cafes = Array.from(merged.values()).sort((a, b) => a.name.localeCompare(b.name, "uk"));
        cafes = applyCafeCorrections(cafes);
      }
      refreshCafeList();
      function isOperating(tags) {
        for (const key in tags) {
          if (LIFECYCLE.includes(key.split(":")[0])) return false;
        }
        const closed = [tags.closed, tags.disused, tags.abandoned, tags.vacant, tags.permanently_closed, tags.status, tags["operational_status"]]
          .some((value) => /^(yes|true|1|closed|permanently closed|disused|abandoned|vacant)$/i.test(String(value || "").trim()));
        if (closed) return false;
        if (
          tags.end_date ||
          tags["cafe:state"] === "closed" ||
          tags.lifecycle === "closed" ||
          tags.access === "private" ||
          tags.access === "no"
        ) return false;
        if (/^\s*(closed|off)\s*$/i.test(tags.opening_hours || "")) return false;
        const notes = [tags.name, tags["name:uk"], tags["name:en"], tags.description, tags.note].filter(Boolean).join(" ");
        if (/закрит|зачинен|не працює|closed|permanently closed/i.test(notes)) return false;
        return true;
      }

      function isCoffeePlace(tags, name) {
        if (tags["drink:coffee"] === "no") return false;
        if (tags.shisha === "yes" || tags.hookah === "yes" || tags.cafe === "hookah" || tags.cafe === "shisha") return false;
        const cuisine = (tags.cuisine || "").toLowerCase();
        if (NOT_COFFEE_CUISINE.test(cuisine) || NOT_COFFEE_NAME.test(name)) return false;
        return true;
      }

      function cafeAddress(tags) {
        const street = tags["addr:street"] || tags["addr:place"];
        const number = tags["addr:housenumber"];
        if (street) return street + (number ? ", " + number : "");
        return (tags["addr:full"] || "")
          .replace(/(?:,\s*)?(?:м\.?\s*)?(?:Київ|Kyiv)(?:,\s*Україна)?/gi, "")
          .replace(/^[,\s]+|[,\s]+$/g, "");
      }

      function parseCafes(elements) {
        const unique = new Map();
        elements.forEach((place) => {
          const lat = place.lat != null ? place.lat : place.center && place.center.lat;
          const lon = place.lon != null ? place.lon : place.center && place.center.lon;
          if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
          const tags = place.tags || {};
          if (tags.amenity !== "cafe") return;
          const name = (tags.name || tags["name:uk"] || tags.brand || "").trim();
          if (!name || !isOperating(tags) || !isCoffeePlace(tags, name)) return;

          const key = name.toLocaleLowerCase("uk") + "|" + Math.round(lat * 2500) + "|" + Math.round(lon * 1600);
          if (unique.has(key)) return;
          unique.set(key, {
            id: place.type + "/" + place.id,
            source: "osm",
            name,
            address: cafeAddress(tags),
            lat: +lat.toFixed(6),
            lon: +lon.toFixed(6)
          });
        });
        return Array.from(unique.values()).sort((a, b) => a.name.localeCompare(b.name, "uk"));
      }

      function normalizedCafeText(value) {
        return String(value || "").toLocaleLowerCase("uk").replace(/[^a-zа-яіїє0-9]/gi, "");
      }

      function distanceMeters(lat1, lon1, lat2, lon2) {
        const meanLat = (lat1 + lat2) * Math.PI / 360;
        const dx = (lon2 - lon1) * 111320 * Math.cos(meanLat);
        const dy = (lat2 - lat1) * 111320;
        return Math.hypot(dx, dy);
      }

      function applyCafeCorrections(list) {
        const corrected = list.filter((cafe) => {
          const name = normalizedCafeText(cafe.name);
          if (!name.includes("aromakava") && !name.includes("аромакава")) return true;
          return !MANUALLY_CLOSED_CAFES.some((closed) =>
            distanceMeters(cafe.lat, cafe.lon, closed.lat, closed.lon) <= closed.radiusMeters
          );
        });

        MANUAL_CAFES.forEach((manualCafe) => {
          const existingIndex = corrected.findIndex((cafe) =>
            normalizedCafeText(cafe.name).includes("slou") &&
            distanceMeters(cafe.lat, cafe.lon, manualCafe.lat, manualCafe.lon) <= 80
          );
          if (existingIndex === -1) corrected.push(manualCafe);
          else corrected[existingIndex] = { ...corrected[existingIndex], ...manualCafe };
        });

        return corrected.sort((a, b) => a.name.localeCompare(b.name, "uk"));
      }

      function parseCityBoundary(elements) {
        const relation = elements.find((el) => el.type === "relation" && el.id === KYIV_RELATION);
        if (!relation || !Array.isArray(relation.members)) return [];
        const same = (a, b) => Math.abs(a[0] - b[0]) < 1e-7 && Math.abs(a[1] - b[1]) < 1e-7;
        const rings = [];

        ["outer", "inner"].forEach((role) => {
          const segments = relation.members
            .filter((m) => m.type === "way" && m.role === role && Array.isArray(m.geometry))
            .map((m) => m.geometry.map((p) => [+p.lat.toFixed(5), +p.lon.toFixed(5)]))
            .filter((pts) => pts.length > 1);

          while (segments.length) {
            const ring = segments.shift();
            let joined = true;
            while (!same(ring[0], ring[ring.length - 1]) && joined) {
              joined = false;
              for (let i = 0; i < segments.length; i += 1) {
                const seg = segments[i];
                const first = seg[0];
                const last = seg[seg.length - 1];
                if (same(ring[ring.length - 1], first)) ring.push(...seg.slice(1));
                else if (same(ring[ring.length - 1], last)) ring.push(...seg.slice(0, -1).reverse());
                else if (same(ring[0], last)) ring.unshift(...seg.slice(0, -1));
                else if (same(ring[0], first)) ring.unshift(...seg.slice(1).reverse());
                else continue;
                segments.splice(i, 1);
                joined = true;
                break;
              }
            }
            if (ring.length >= 4 && same(ring[0], ring[ring.length - 1])) rings.push({ role, points: ring });
          }
        });
        return rings;
      }

      async function overpass(query) {
        let lastError = new Error("Overpass unavailable");
        for (const url of OVERPASS_URLS) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), OVERPASS_TIMEOUT);
          try {
            const response = await fetch(url, {
              method: "POST",
              body: new URLSearchParams({ data: query }),
              signal: controller.signal
            });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            if (!Array.isArray(data.elements)) throw new Error("Bad response");
            // Overpass reports timeouts as 200 + remark with partial data — treat as failure
            if (data.remark && /error|timed out|out of memory/i.test(data.remark)) throw new Error(data.remark);
            return data.elements;
          } catch (error) {
            lastError = error;
          } finally {
            clearTimeout(timer);
          }
        }
        throw lastError;
      }

      async function loadCafes(force = false) {
        if (cafes.length) redraw();
        if (!force && cafes.length && Date.now() - cafesFetchedAt < CAFE_TTL) return;
        if (!cafes.length) showStatus("loading");
        try {
          const elements = await overpass(
            "[out:json][timeout:90];area(" + KYIV_AREA + ")->.k;nwr[\"amenity\"=\"cafe\"](area.k);out center;"
          );
const latest = parseCafes(elements);
          if (!latest.length) throw new Error("Empty");
          osmCafes = applyCafeCorrections(latest).map((cafe) => ({ ...cafe, source: "osm" }));
          cafesFetchedAt = Date.now();
          store.set(CAFE_CACHE, { places: osmCafes, fetchedAt: cafesFetchedAt });
          refreshCafeList();
          hideStatus();
          redraw();
        } catch {
          if (!cafes.length) showStatus("error");
        }
      }

      async function loadBoundary() {
        if (cityBoundary.length) drawBoundary();
        if (cityBoundary.length && Date.now() - boundaryFetchedAt < BOUNDARY_TTL) return;
        try {
          const rings = parseCityBoundary(await overpass("[out:json][timeout:60];relation(" + KYIV_RELATION + ");out geom;"));
          if (!rings.length) return;
          cityBoundary = rings;
          store.set(BOUNDARY_CACHE, { rings, fetchedAt: Date.now() });
          drawBoundary();
        } catch { /* the map works fine without the outline */ }
      }

      function showStatus(kind) {
        const el = $("status");
        el.className = "status glass on " + kind;
        el.title = "";
        $("retry").hidden = false;
        $("statusText").textContent = kind === "loading" ? "Шукаю кав’ярні" : "Не вдалося завантажити";
      }
      function hideStatus() { $("status").classList.remove("on"); }

      function drawBoundary() {
        if (!map || !cityBoundary.length) return;
        maskLayer.clearLayers();
        boundaryLayer.clearLayers();
        const points = cityBoundary.flatMap((ring) => ring.points);
        const outer = L.latLngBounds(points).pad(6);
        const sw = outer.getSouthWest();
        const ne = outer.getNorthEast();
        const frame = [[sw.lat, sw.lng], [ne.lat, sw.lng], [ne.lat, ne.lng], [sw.lat, ne.lng]];
        L.polygon([frame, ...cityBoundary.map((r) => r.points)], {
          pane: "maskPane", stroke: false, fillColor: "#2b1d16", fillOpacity: .22, fillRule: "evenodd", smoothFactor: 3, interactive: false
        }).addTo(maskLayer);
        cityBoundary.forEach((ring) => {
          L.polyline(ring.points, { pane: "borderPane", color: "#fbf8f2", weight: 6, opacity: .7, smoothFactor: 3, interactive: false }).addTo(boundaryLayer);
          L.polyline(ring.points, { pane: "borderPane", color: "#5d3d2e", weight: 1.6, opacity: .85, smoothFactor: 3, interactive: false }).addTo(boundaryLayer);
        });
        map.setMaxBounds(L.latLngBounds(points).pad(.5));
      }

      function visibleCafes() {
        const query = $("search").value.trim().toLocaleLowerCase("uk");
        return cafes.filter((cafe) =>
          (!onlyVisited || visited.has(cafe.id)) &&
          (!query || (cafe.name + " " + cafe.address).toLocaleLowerCase("uk").includes(query))
        );
      }

      function createCafeCanvas() {
        cafeCanvas = document.createElement("canvas");
        cafeCanvas.className = "cafe-canvas leaflet-zoom-animated";
        cafeCanvas.setAttribute("aria-hidden", "true");
        map.getPane("markerPane").append(cafeCanvas);
        cafeCanvasContext = cafeCanvas.getContext("2d", { alpha: true });
      }

      function animateCafeCanvas(event) {
        if (!cafeCanvas || !cafeCanvasOriginLatLng || cafeCanvasBaseZoom == null) return;
        const offset = map._latLngToNewLayerPoint(cafeCanvasOriginLatLng, event.zoom, event.center);
        L.DomUtil.setTransform(cafeCanvas, offset, map.getZoomScale(event.zoom, cafeCanvasBaseZoom));
      }
      function cafePressScale(cafeId, now) {
        if (!pinPressAnimation || pinPressAnimation.cafeId !== cafeId) return 1;
        const progress = Math.min(1, (now - pinPressAnimation.startedAt) / PIN_PRESS_DURATION);
        const easeOut = (value) => 1 - Math.pow(1 - value, 3);
        if (progress < .35) return 1 - .18 * easeOut(progress / .35);
        if (progress < .7) return .82 + .24 * easeOut((progress - .35) / .35);
        return 1.06 - .06 * easeOut((progress - .7) / .3);
      }
      function drawBean(context, x, y, size, cafe, scale = 1, shake = 0) {
        const selected = selectedCafe && selectedCafe.id === cafe.id;
        const displaySize = size * scale + (selected ? 5 : 0);
        context.save();
        context.translate(x, y);
        context.rotate(-Math.PI / 7.5 + shake);
        context.scale(displaySize / 24, displaySize / 24);
        context.translate(-12, -12);
        context.fillStyle = roastColor(cafeRatings.get(cafe.id) || 0);
        context.strokeStyle = "rgba(55, 33, 22, .9)";
        context.lineWidth = .75;
        context.lineJoin = "round";

        if (typeof BEAN_SHAPE !== "undefined" && BEAN_SHAPE) {
          context.fill(BEAN_SHAPE);
          context.stroke(BEAN_SHAPE);
        } else {
          context.beginPath();
          context.ellipse(12, 12, 7.5, 10, -.55, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        }

        context.beginPath();
        context.moveTo(6.2, 18.7);
        context.bezierCurveTo(11.5, 15.2, 15, 9.4, 17.1, 4.8);
        context.strokeStyle = "#fbf8f2";
        context.lineWidth = 1.3;
        context.lineCap = "round";
        context.stroke();
        context.restore();
      }

      function drawPins() {
        if (!map || !cafeCanvas || !cafeCanvasContext) return;
        const size = map.getSize();
        if (!size.x || !size.y) return;

        const maxRatio = window.innerWidth <= 700 ? 2 : 1.5;
        const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
        const width = Math.round(size.x * ratio);
        const height = Math.round(size.y * ratio);
        if (cafeCanvas.width !== width || cafeCanvas.height !== height) {
          cafeCanvas.width = width;
          cafeCanvas.height = height;
          cafeCanvas.style.width = size.x + "px";
          cafeCanvas.style.height = size.y + "px";
        }

        const context = cafeCanvasContext;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, size.x, size.y);

        const origin = map.containerPointToLayerPoint([0, 0]);
        cafeCanvasOriginLatLng = map.containerPointToLatLng([0, 0]);
        cafeCanvasBaseZoom = map.getZoom();
        L.DomUtil.setPosition(cafeCanvas, origin);
        const bounds = map.getBounds();
        const zoom = map.getZoom();
        const beanSize = zoom < 12 ? 17 : zoom < 14 ? 20 : zoom < 16 ? 23 : 26;
        const shake = shakingCafeId ? Math.sin(performance.now() / 34) * .15 : 0;
        visiblePins = [];
        let selectedPin = null;
        const animationTime = performance.now();

        mapCafes.forEach((cafe) => {
          if (!bounds.contains([cafe.lat, cafe.lon])) return;
          const point = map.latLngToLayerPoint([cafe.lat, cafe.lon]);
          const pin = {
            cafe,
            x: point.x - origin.x,
            y: point.y - origin.y,
            radius: Math.max(12, beanSize * .58)
          };
          visiblePins.push(pin);
          const beanScale = cafePressScale(cafe.id, animationTime) * (cafe.id === shakingCafeId ? 1 + shake / 100 : 1);
          if (selectedCafe && cafe.id === selectedCafe.id) selectedPin = pin;
          else drawBean(context, pin.x, pin.y, beanSize, cafe, beanScale, cafe.id === shakingCafeId ? shake : 0);
        });

        if (selectedPin) {
          const selectedScale = cafePressScale(selectedPin.cafe.id, animationTime) * (selectedPin.cafe.id === shakingCafeId ? 1 + shake / 100 : 1);
          drawBean(context, selectedPin.x, selectedPin.y, beanSize, selectedPin.cafe, selectedScale, selectedPin.cafe.id === shakingCafeId ? shake : 0);
        }
      }

      function schedulePinDraw() {
        if (drawFrame || !cafeCanvas) return;
        drawFrame = requestAnimationFrame(() => {
          drawFrame = 0;
          drawPins();
          if (pinPressAnimation) {
            if (performance.now() - pinPressAnimation.startedAt < PIN_PRESS_DURATION) schedulePinDraw();
            else pinPressAnimation = null;
          }
        });
      }

      function animateCafePinPress(cafe) {
        if (reduceMotion) return;
        pinPressAnimation = { cafeId: cafe.id, startedAt: performance.now() };
        schedulePinDraw();
      }

      function schedulePinDrawOnPinch(event) {
        if (event && event.pinch) schedulePinDraw();
      }
      function redraw() {
        clearTimeout(drawTimer);
        drawTimer = setTimeout(() => {
          drawTimer = 0;
          mapCafes = visibleCafes();
          cafeById.clear();
          mapCafes.forEach((cafe) => cafeById.set(cafe.id, cafe));
          schedulePinDraw();
        }, 100);
      }

      function cafeAtPoint(point) {
        let nearest = null;
        let nearestDistance = Infinity;
        visiblePins.forEach((pin) => {
          const dx = point.x - pin.x;
          const dy = point.y - pin.y;
          const distance = dx * dx + dy * dy;
          if (distance <= pin.radius * pin.radius && distance < nearestDistance) {
            nearest = pin.cafe;
            nearestDistance = distance;
          }
        });
        return nearest;
      }

      function setAddingCafe(active) {
        addingCafe = Boolean(active);
        const button = $("addCafeToggle");
        button.setAttribute("aria-pressed", String(addingCafe));
        map.getContainer().classList.toggle("placing-cafe", addingCafe);
        $("mapHint").classList.toggle("on", addingCafe);
        if (!addingCafe) pendingCafePoint = null;
      }

      function openCafeAddDialog(point) {
        setAddingCafe(false);
        pendingCafePoint = point;
        $("addCafeForm").reset();
        $("addCafeHelp").textContent = "Точка вже стоїть на мапі. Додай назву й, за бажанням, адресу.";
        $("addCafeDialog").showModal();
        setTimeout(() => $("newCafeName").focus(), 40);
      }

      async function saveCafe(event) {
        event.preventDefault();
        if (!pendingCafePoint) return;
        const button = $("saveNewCafe");
        button.disabled = true;
        try {
          if (sharedRequested && !sharedReady) throw new Error("Спільна мапа ще не підключена");
          const cafe = {
            id: makeCafeId(),
            name: $("newCafeName").value.trim(),
            address: $("newCafeAddress").value.trim(),
            lat: +pendingCafePoint.lat.toFixed(6),
            lon: +pendingCafePoint.lng.toFixed(6),
            source: sharedMode ? "shared" : "local"
          };
          if (!cafe.name) return $("newCafeName").focus();

          if (sharedMode) {
            const { data, error } = await sharedClient.from("de_caf_cafes").insert({
              id: cafe.id,
              name: cafe.name,
              address: cafe.address,
              lat: cafe.lat,
              lon: cafe.lon
            }).select("*").single();
            if (error) throw error;
            sharedCafeRows.push(sharedCafeFromRow(data));
            refreshCafeList();
          } else {
            const next = [...localCustomCafes, cafe];
            if (!store.set(CUSTOM_CAFES_KEY, next)) throw new Error("Не вдалося зберегти кав’ярню в цьому браузері");
            localCustomCafes = next;
            refreshCafeList();
          }

          pendingCafePoint = null;
          $("addCafeDialog").close();
          redraw();
          const saved = cafes.find((item) => item.id === cafe.id);
          if (saved) selectCafe(saved, true);
        } catch (error) {
          $("addCafeHelp").textContent = sharedMode
            ? "Не вдалося додати кав’ярню. Перевір підключення й спробуй ще раз."
            : error.message || "Не вдалося додати кав’ярню.";
        } finally {
          button.disabled = false;
        }
      }

      function startCafeShake(cafe) {
        pendingCafeRemoval = cafe;
        shakingCafeId = cafe.id;
        const started = performance.now();
        const duration = reduceMotion ? 0 : 620;
        const animate = (now) => {
          drawPins();
          if (now - started < duration) {
            requestAnimationFrame(animate);
            return;
          }
          shakingCafeId = null;
          drawPins();
          $("deleteCafeText").textContent = sharedMode
            ? `«${cafe.name}» зникне зі спільної мапи для всіх.`
            : `«${cafe.name}» зникне з твоєї мапи.`;
          $("deleteCafeDialog").showModal();
        };
        requestAnimationFrame(animate);
      }

      async function removeCafe(cafe) {
        if (sharedRequested && !sharedReady) throw new Error("Спільна мапа ще не підключена");
        if (sharedMode) {
          const { error } = await sharedClient.rpc("de_caf_remove_cafe", { p_cafe_id: cafe.id });
          if (error) throw error;
          if (cafe.source === "osm") sharedHiddenCafeIds.add(cafe.id);
          else sharedCafeRows = sharedCafeRows.filter((item) => item.id !== cafe.id);
        } else if (cafe.source === "local") {
          const next = localCustomCafes.filter((item) => item.id !== cafe.id);
          if (!store.set(CUSTOM_CAFES_KEY, next)) throw new Error("Не вдалося оновити список кав’ярень");
          localCustomCafes = next;
        } else {
          const next = new Set(localHiddenCafeIds);
          next.add(cafe.id);
          if (!store.set(HIDDEN_CAFES_KEY, Array.from(next))) throw new Error("Не вдалося оновити список кав’ярень");
          localHiddenCafeIds = next;
        }

        if (selectedCafe && selectedCafe.id === cafe.id) closeCard();
        refreshCafeList();
        redraw();
      }

      function makeCafeId() {
        const id = window.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        return "custom:" + id;
      }

      function loadSupabaseSdk() {
        if (window.supabase && window.supabase.createClient) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
          script.crossOrigin = "anonymous";
          script.onload = () => window.supabase && window.supabase.createClient
            ? resolve()
            : reject(new Error("Не вдалося завантажити бібліотеку спільної мапи"));
          script.onerror = () => reject(new Error("Не вдалося завантажити бібліотеку спільної мапи"));
          document.head.append(script);
        });
      }

      function askForDisplayName() {
        return new Promise((resolve) => {
          const dialog = $("profileDialog");
          const form = $("profileForm");
          const input = $("profileName");
          const onSubmit = (event) => {
            event.preventDefault();
            const name = input.value.trim();
            if (!name) return;
            dialog.close();
            resolve(name);
          };
          const onCancel = (event) => event.preventDefault();
          form.addEventListener("submit", onSubmit, { once: true });
          dialog.addEventListener("cancel", onCancel, { once: true });
          dialog.showModal();
          setTimeout(() => input.focus(), 40);
        });
      }

      function sharedCafeFromRow(row) {
        return {
          id: row.id,
          name: row.name,
          address: row.address || "",
          lat: Number(row.lat),
          lon: Number(row.lon),
          source: "shared",
          createdBy: row.created_by
        };
      }

      function sharedReviewFromRow(row) {
        return {
          id: row.id,
          cafeId: row.cafe_id,
          cafeName: row.cafe_name,
          rating: Number(row.rating),
          drinks: row.drinks || [],
          decaf: Boolean(row.decaf),
          price: row.price == null ? null : Number(row.price),
          text: row.body || "",
          photo: row.photo_path || "",
          createdAt: Date.parse(row.created_at) || Date.now(),
          authorName: row.author_name || "Друг",
          userId: row.user_id
        };
      }

      async function loadSharedData() {
        const [cafeResult, removedResult, reviewResult] = await Promise.all([
          sharedClient.from("de_caf_cafes").select("*").order("created_at", { ascending: true }),
          sharedClient.from("de_caf_removed_cafes").select("cafe_id"),
          sharedClient.from("de_caf_reviews").select("*").order("created_at", { ascending: false })
        ]);
        const failed = cafeResult.error || removedResult.error || reviewResult.error;
        if (failed) throw failed;

        sharedCafeRows = (cafeResult.data || []).map(sharedCafeFromRow);
        sharedHiddenCafeIds = new Set((removedResult.data || []).map((row) => row.cafe_id));
        reviews = (reviewResult.data || []).map(sharedReviewFromRow);
        visited = new Set(reviews.map((review) => review.cafeId));
        updateCafeRatings();
        refreshCafeList();
        redraw();
        renderAllReviews();
        if (selectedCafe) renderCafeReviews();
        updateBadge();
      }

      function queueSharedRefresh() {
        clearTimeout(sharedRefreshTimer);
        sharedRefreshTimer = setTimeout(() => {
          loadSharedData().catch((error) => console.error("Could not refresh de caf data", error));
        }, 220);
      }

      function watchSharedData() {
        sharedChannel = sharedClient.channel("de-caf-shared-map")
          .on("postgres_changes", { event: "*", schema: "public", table: "de_caf_reviews" }, queueSharedRefresh)
          .on("postgres_changes", { event: "*", schema: "public", table: "de_caf_cafes" }, queueSharedRefresh)
          .on("postgres_changes", { event: "*", schema: "public", table: "de_caf_removed_cafes" }, queueSharedRefresh)
          .subscribe();
      }

      function sharedConnectionHint(error) {
        const message = String(error && (error.message || error.error_description) || error || "").trim();
        const lower = message.toLowerCase();
        if (lower.includes("invite link is invalid or disabled")) {
          return "Запрошення не зареєстроване або вимкнене в public.de_caf_invites. Запусти SQL для invite-посилання.";
        }
        if (lower.includes("anonymous sign-ins") || lower.includes("anonymous sign-in") || lower.includes("anonymous provider")) {
          return "У Supabase увімкни Anonymous Sign-Ins: Authentication → Sign In / Providers.";
        }
        if (lower.includes("de_caf_join") && (lower.includes("schema cache") || lower.includes("could not find") || lower.includes("function"))) {
          return "Supabase не знаходить de_caf_join. Перевір, чи виконано schema.sql у SQL Editor.";
        }
        if (lower.includes("row-level security") || lower.includes("permission denied") || lower.includes("not allowed") || lower.includes("permission")) {
          return "Supabase відхилив доступ. Перевір таблиці, права GRANT і RLS із schema.sql.";
        }
        if (lower.includes("invalid api key") || lower.includes("no api key") || lower.includes("project not found") || lower.includes("jwt")) {
          return "Перевір URL і Publishable/anon key у supabase-config.js.";
        }
        if (lower.includes("failed to fetch") || lower.includes("networkerror") || lower.includes("load failed")) {
          return "Не вдалося звернутися до Supabase/CDN. Перевір URL у конфігурації та мережу.";
        }
        return message ? "Помилка Supabase: " + message.slice(0, 115) : "Не вдалося підключитися до спільної мапи.";
      }

      async function initializeSharedWorkspace() {
        if (!sharedRequested) return;
        const publishableKey = sharedConfig.publishableKey || sharedConfig.anonKey;
        if (!sharedConfig.url || !publishableKey) {
          showStatus("error");
          $("statusText").textContent = "Немає URL або ключа Supabase в supabase-config.js";
          $("status").title = "Очікується window.DECAF_SHARED_CONFIG = { url, publishableKey } (або anonKey). Переконайся, що supabase-config.js завантажується з кореня сайту.";
          $("retry").hidden = true;
          return;
        }

        showStatus("loading");
        $("statusText").textContent = "Підключаю спільну мапу";
        try {
          await loadSupabaseSdk();
          sharedClient = window.supabase.createClient(sharedConfig.url, publishableKey);
          let { data: sessionResult, error } = await sharedClient.auth.getSession();
          if (error) throw error;
          if (!sessionResult.session) {
            const signIn = await sharedClient.auth.signInAnonymously();
            if (signIn.error) throw signIn.error;
            sessionResult = { session: signIn.data.session };
          }
          sharedUser = sessionResult.session.user;

          let joined = await sharedClient.rpc("de_caf_join", {
            p_invite_code: sharedInviteCode,
            p_display_name: null
          });
          if (joined.error) throw joined.error;
          let member = Array.isArray(joined.data) ? joined.data[0] : joined.data;
          sharedDisplayName = member && member.display_name || "";
          if (!sharedDisplayName) {
            const name = await askForDisplayName();
            joined = await sharedClient.rpc("de_caf_join", {
              p_invite_code: sharedInviteCode,
              p_display_name: name
            });
            if (joined.error) throw joined.error;
            member = Array.isArray(joined.data) ? joined.data[0] : joined.data;
            sharedDisplayName = member && member.display_name || name;
          }

          sharedMode = true;
          $("drawerTitle").childNodes[0].textContent = "Стрічка ";
          $("reviewsToggle").setAttribute("aria-label", "Стрічка");
          $("reviewsToggle").title = "Стрічка";
          await loadSharedData();
          sharedReady = true;
          $("reviewsToggle").hidden = false;
          $("shareInvite").hidden = false;
          watchSharedData();
          hideStatus();
        } catch (error) {
          console.error("Could not open de caf shared map", error);
          showStatus("error");
          $("statusText").textContent = sharedConnectionHint(error);
          $("status").title = String(error && (error.message || error.error_description) || error || "");
          $("retry").hidden = true;
        }
      }

        if (!dataUrl) return "";
        const blob = await (await fetch(dataUrl)).blob();
        const path = sharedUser.id + "/" + fileName + ".jpg";
        const { error } = await sharedClient.storage.from(PHOTO_BUCKET).upload(path, blob, {
          contentType: "image/jpeg",
          upsert: false
        });
        if (error) throw error;
        return path;
      }

      async function resolvePhotoUrl(photoPath) {
        if (!photoPath) return "";
        if (!sharedMode || photoPath.startsWith("data:")) return photoPath;
        const cached = photoUrlCache.get(photoPath);
        if (cached && cached.expiresAt > Date.now()) return cached.url;
        const { data, error } = await sharedClient.storage.from(PHOTO_BUCKET).createSignedUrl(photoPath, 3600);
        if (error || !data) return "";
        photoUrlCache.set(photoPath, { url: data.signedUrl, expiresAt: Date.now() + 55 * 60 * 1000 });
        return data.signedUrl;
      }

      async function deleteReview(id) {
        const review = reviews.find((item) => item.id === id);

        if (sharedMode) {

      function bindSheetScrollShadow(sheet) {

      }

      function bindSheetDrag(sheet, onClose) {
        const grip = sheet.querySelector(".sheet-top");
        let drag = null;

        const finish = (event, cancelled) => {
          if (!drag || event.pointerId !== drag.pointerId) return;
          const distance = drag.distance;
          const velocity = distance / Math.max(1, performance.now() - drag.startedAt);
          drag = null;
          sheet.classList.remove("dragging");
          sheet.style.removeProperty("--drag");
          if (cancelled) return;
          if (distance > 260 || (distance > 60 && velocity > .9)) onClose();
          else if (distance > 70) {
            if (sheet.classList.contains("compact")) onClose();
            else sheet.classList.add("compact");
          } else if (distance < -40) sheet.classList.remove("compact");
        };

        grip.addEventListener("pointerdown", (e) => {
          if (!mobileQuery.matches || e.button > 0 || e.target.closest("button, a, input")) return;
          drag = { pointerId: e.pointerId, startY: e.clientY, distance: 0, startedAt: performance.now() };
          grip.setPointerCapture(e.pointerId);
          sheet.classList.add("dragging");
        });
        grip.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.pointerId) return;
          drag.distance = e.clientY - drag.startY;
          const offset = drag.distance < 0 ? drag.distance * .2 : drag.distance;
          sheet.style.setProperty("--drag", offset + "px");
        });
        grip.addEventListener("pointerup", (e) => finish(e, false));
        grip.addEventListener("pointercancel", (e) => finish(e, true));
      }

      async function compressPhoto(file) {
        if (!file) return "";
        if (!file.type.startsWith("image/")) throw new Error("Потрібне зображення");
        if (file.size > 12 * 1024 * 1024) throw new Error("Фото до 12 МБ");
        const url = URL.createObjectURL(file);
        try {
          const image = new Image();
          await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error("Не вдалося відкрити фото"));
            image.src = url;
          });
          const scale = Math.min(1, 1000 / Math.max(image.naturalWidth, image.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(image.naturalWidth * scale);
          canvas.height = Math.round(image.naturalHeight * scale);
          canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
          return canvas.toDataURL("image/jpeg", .78);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
